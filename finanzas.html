// calculadora dentro del importe: acepta 1500+500, 3*250, etc.
function calcMonto(t){
  const s = String(t||'').replace(/,/g,'').replace(/\s/g,'');
  if(!/^[0-9+\-*/().]+$/.test(s)) return 0;
  try{ const v = Function('"use strict"; return (' + s + ')')(); return (isFinite(v) && v > 0) ? Math.round(v*100)/100 : 0; }catch(e){ return 0; }
}

function necesidades(i, n){
  return i.preparacion.lineas.filter(l=>l.tipo==='insumo').map(l=>{
    const x = insumos.find(z=>z.id===l.insumoId); if(!x) return null;
    const need = (Number(l.cantidad)||0) * n / (Number(x.rinde)||1);
    const falta = (x.stock!==null && x.stock!==undefined && Number(x.stock) + 1e-9 < need);
    return {x, need, falta, sinConteo:(x.stock===null||x.stock===undefined)};
  }).filter(Boolean);
}
function pintarNecesidades(id){
  const i = insumos.find(x=>x.id===id), n = num($('#pdN').value), nec = necesidades(i, n), hayFalta = nec.some(r=>r.falta);
  const prod = n * (Number(i.preparacion.rinde)||1);
  $('#pdNec').innerHTML = `<div class="sub" style="margin-bottom:4px;">Produce ${fnum(prod)} ${esc(i.unidad)}${i.rinde>1?' (≈ '+fnum(prod*i.rinde)+' '+esc(i.porcion)+'s)':''} y usa:</div>` +
    nec.map(r=>`<div class="row" style="padding:4px 0; font-size:12.5px; border-bottom:1px solid #f6e6e9;"><span>${esc(r.x.nombre.replace(/ \(.*/,''))}</span><span style="color:${r.falta?'#b62d11':'inherit'};">${fnum(r.need)} ${esc(r.x.unidad)} ${r.falta?'⚠️ solo hay '+fnum(r.x.stock):(r.sinConteo?'<span class="sub">(sin conteo)</span>':'')}</span></div>`).join('') +
    (hayFalta ? '<div class="alerta" style="margin:8px 0 0;">No alcanza algún ingrediente. Compra más o prepara menos.</div>' : '');

function faltaParaUna(r, ctx, ignorarVariables){
  for(const l of r.lineas){
    if(l.tipo==='fijo' || (ignorarVariables && l.tipo==='variable')) continue;
    const i = insumos.find(x=>x.id===idLinea(l, ctx)); if(!i || i.stock===null || i.stock===undefined) continue;
    if(Number(i.stock) + 1e-9 < (Number(l.cantidad)||0)/(Number(i.rinde)||1)) return true;
  }
  return false;
}
function calcularAgotados(){
  const out = {productos:{}, bases:{}, cremas:{}, toppings:{}, frutas:{}};
  const sinStock = id=>{ const i = insumos.find(x=>x.id===id); return !!i && i.stock!==null && i.stock!==undefined && Number(i.stock) <= 0; };
  Object.keys(BASE_INSUMO).forEach(k=>{ if(sinStock(BASE_INSUMO[k])) out.bases[k] = true; });
  Object.keys(CREMA_INSUMO).forEach(k=>{ if(sinStock(CREMA_INSUMO[k])) out.cremas[k] = true; });
  Object.keys(TOPPING_INSUMO).forEach(k=>{ if(sinStock(TOPPING_INSUMO[k])) out.toppings[k] = true; });
  if(sinStock('fresas')){ out.frutas.fresa = true; out.frutas.mixto = true; }
  const md = menuData || {}, lista = [].concat(md.favoritas||[], md.premium||[], md.otros||[], ...(md.categoriasExtra||[]).map(c=>c.items||[]));
  lista.forEach(p=>{
    const sizes = (p.sizes && p.sizes.length) ? p.sizes.map(s=>s.label) : ['Único'];
    const evals = sizes.map(sl=>{
      const det = ['Tamaño: ' + sl], key = clasificar(p.nombre, det), r = cfg.recetas[key]; if(!r || !r.lineas.length) return null;
      if(cfg.control && cfg.control[key]==='terminado'){ const pt = insumos.find(x=>x.id==='pt_'+key); return !!pt && pt.stock!==null && pt.stock!==undefined && Number(pt.stock) < 1; }
      return faltaParaUna(r, inferirCtx(p.nombre, det), key==='canasta');
    }).filter(x=>x!==null);
    if(evals.length && evals.every(x=>x)) out.productos[p.id] = true;
  });
  return out;
}

/* ================= costos ================= */
const costoUnit = i=> i.preparacion ? sum(i.preparacion.lineas, l=>costoLinea(l)) / (Number(i.preparacion.rinde)||1) / (Number(i.rinde)||1) : (Number(i.precio)||0) / (Number(i.rinde)||1);
const costoPorUnidadStock = i=> costoUnit(i) * (Number(i.rinde)||1);
const DEFAULT_VAR = {crema:'crema_lista', base:'dulce_leche', complemento:'choco_negro'};
const BASE_INSUMO = {dulce_leche:'dulce_leche', leche_cond:'leche_condensada', syrup_caramelo:'caramelo', nutella:'nutella', pistacho:'pistacho_mezcla', choco_derretido:'choco_negro'};
const CREMA_INSUMO = {tradicional:'crema_lista', choco:'crema_choco', coco:'crema_coco'};
const TOPPING_INSUMO = {galletas:'galleta_choco', granola:'granola', chispas_choco:'chispas_choco', coco_rallado:'coco_rallado', kataifi:'kataifi', chispas_color:'chispas_color'};
const sinAcentos = t=> String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const idLinea = (l, ctx)=> l.tipo==='variable' ? ((ctx && ctx[l.variable]) || DEFAULT_VAR[l.variable]) : l.insumoId;
function costoLinea(l, ctx){
  if(l.tipo==='fijo') return Number(l.monto)||0;
  if(l.tipo==='variable' && idLinea(l, ctx)==='__ninguna') return 0;
  const i = insumos.find(x=>x.id===idLinea(l, ctx));
  const u = (l.costoManual!==undefined && l.costoManual!==null && l.costoManual!=='') ? Number(l.costoManual) : (i ? costoUnit(i) : 0);
  return (Number(l.cantidad)||0) * u;
}
const costoReceta = (r, ctx)=> sum(r.lineas, l=>costoLinea(l, ctx));
const ing0 = r=> costoReceta(r, DEFAULT_VAR);
const pctIndirectos = ()=> (sum(Object.values(cfg.indirectos), x=>x))/100;
const pctMO = ()=> (Number(cfg.indirectos.manoObra)||0)/100;
function baseDeTexto(m){
  if(/sin base/.test(m)) return '__ninguna';
  if(/nutella/.test(m)) return 'nutella'; if(/pistacho/.test(m)) return 'pistacho_mezcla'; if(/condensada/.test(m)) return 'leche_condensada';
  if(/caramelo/.test(m)) return 'caramelo'; if(/chocolate/.test(m)) return 'choco_negro'; return 'dulce_leche';
}
// ¿Qué crema y qué base lleva este pedido? (favoritas por su combinación; personalizadas y canasta por sus detalles)
function inferirCtx(nombre, detalles){
  const ctx = {}, nn = sinAcentos(nombre);
  (cfg.combos||[]).forEach(c=>{ if(new RegExp(c.match).test(nn)){ ctx.crema = c.crema; ctx.base = c.base; } });
  (detalles||[]).forEach(l=>{ const m = sinAcentos(l);
    if(/^crema:/.test(m)) ctx.crema = /choco/.test(m) ? 'crema_choco' : (/coco/.test(m) ? 'crema_coco' : 'crema_lista');
    else if(/^(base|syrup):/.test(m)) ctx.base = baseDeTexto(m);
    else if(/^complemento:|^que prefieres/.test(m)) ctx.complemento = /nutella/.test(m) ? 'nutella' : 'choco_negro';
  });
  return ctx;
}
function fijosDiarios(){
  let gasto = 0, ahorro = 0;
  cfg.fijos.forEach(f=>{
    if(f.activo === false) return;
    const d = f.per==='mes' ? f.monto/30 : (f.per==='anio' ? f.monto/365 : f.monto/7);
    if(f.ahorro) ahorro += d; else gasto += d;
  });
  return {gasto, ahorro};
}
function ensurePT(key){
  const r = cfg.recetas[key]; if(!r) return null; const id = 'pt_' + key;
  const lineas = r.lineas.map(l=> l.tipo==='fijo' ? {...l} : {tipo:'insumo', insumoId:idLinea(l, DEFAULT_VAR), cantidad:l.cantidad});
  let i = insumos.find(x=>x.id===id);
  if(!i){ i = {id, nombre:r.nombre + ' (preparado)', categoria:'Preparaciones', subcat:'', unidad:'unidad', rinde:1, porcion:'unidad', precio:0, minimo:null, stock:null, nota:'Producto terminado', preparacion:{rinde:1, lineas}}; insumos.push(i); const {id:_x, ...rest} = i; db.collection('insumos').doc(id).set(rest); }
  else { i.preparacion.lineas = lineas; i.nombre = r.nombre + ' (preparado)'; db.collection('insumos').doc(id).update({preparacion:i.preparacion, nombre:i.nombre}); }
  return i;
}
function consumosDe(items){
  const cons = {}; let costo = 0, manoObra = 0, sinReceta = 0;
  items.forEach(it=>{
    const r = cfg.recetas[it.producto];
    if(!r){ sinReceta += it.cantidad; return; }
    if(cfg.control && cfg.control[it.producto]==='terminado'){                     // se descuenta lo ya preparado, no los ingredientes (nunca las dos cosas)
      const pt = insumos.find(x=>x.id==='pt_'+it.producto);
      if(pt){ cons[pt.id] = (cons[pt.id]||0) + it.cantidad; const cu = costoUnit(pt); costo += cu*it.cantidad; manoObra += pctMO()*cu*it.cantidad; return; }
    }
    const ctx = {crema:it.crema, base:it.base, complemento:it.complemento};
    costo += costoReceta(r, ctx) * it.cantidad;
    manoObra += pctMO() * costoReceta(r, ctx) * it.cantidad;
    r.lineas.forEach(l=>{
      if(l.tipo==='fijo') return;
      const id = idLinea(l, ctx), i = insumos.find(x=>x.id===id);
      if(id==='__ninguna') return;
      if(i) cons[id] = (cons[id]||0) + (Number(l.cantidad)||0) * it.cantidad / (Number(i.rinde)||1);
    });
  });
  return {cons, costo, manoObra, sinReceta};
}
/* ================= INVENTARIO: libro de movimientos =================
   Cada entrada/salida se guarda como un movimiento con ID único, junto con el cambio de stock, en una sola transacción:
   si se repite la misma operación (recarga, mala señal) no se duplica. */
const r3 = x=> Math.round(x*1000)/1000;
const nuevoId = p=> p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
async function movInv(insumoId, tipo, cantidad, meta){
  meta = meta || {};
  const id = meta.id || nuevoId('mv'), dia = meta.dia || iso(new Date());
  const iRef = db.collection('insumos').doc(insumoId), mRef = db.collection('movimientos').doc(id);
  const res = await db.runTransaction(async tx=>{
    const mv = await tx.get(mRef); if(mv.exists) return {repetido:true};
    const ins = await tx.get(iRef); if(!ins.exists) return {faltante:true};
    const d = ins.data(), antes = (d.stock===null || d.stock===undefined) ? null : Number(d.stock);
    const delta = (tipo==='entrada' ? 1 : -1) * Number(cantidad);
    let despues = null;
    if(antes !== null){
      despues = r3(antes + delta);
      if(despues < 0){ if(meta.estricto) throw new Error('SIN_STOCK'); despues = 0; }
      tx.update(iRef, {stock: despues});
    }
    tx.set(mRef, {insumoId, tipo, cantidad:Number(cantidad), delta: antes===null ? delta : r3(despues-antes), dia, ts:FV.serverTimestamp(), origen:meta.origen||'manual', ref:meta.ref||'', nota:meta.nota||'', stockAntes:antes, stockDespues:despues, ...(meta.extra||{})});
    return {antes, despues};
  });
  if(res && res.despues !== undefined){ const i = insumos.find(x=>x.id===insumoId); if(i){ i.stock = res.despues; if(i.preparacion && res.despues !== null && res.despues <= 0) autoAgotar(insumoId); } programarPublicar(); }
  return res;
}
async function fijarStock(insumoId, nuevo, nota){
  const id = nuevoId('aj'), iRef = db.collection('insumos').doc(insumoId), mRef = db.collection('movimientos').doc(id);
  await db.runTransaction(async tx=>{
    const ins = await tx.get(iRef), d = ins.data(), antes = (d.stock===null || d.stock===undefined) ? null : Number(d.stock);
    const delta = antes===null ? nuevo : r3(nuevo - antes);
    tx.update(iRef, {stock:nuevo});
    if(delta !== 0) tx.set(mRef, {insumoId, tipo: antes===null ? 'inicial' : 'ajuste', cantidad:Math.abs(delta), delta, dia:iso(new Date()), ts:FV.serverTimestamp(), origen:'ajuste', ref:'', nota:nota||'Conteo', stockAntes:antes, stockDespues:nuevo});
  });
  const i = insumos.find(x=>x.id===insumoId); if(i) i.stock = nuevo;
  programarPublicar();
}
// Descuenta (signo 1) o devuelve (signo -1) lo consumido por una venta/producción. El ID del movimiento evita duplicados.
async function aplicarStock(cons, signo, refId, origen){
  for(const id of Object.keys(cons)){
    const i = insumos.find(x=>x.id===id), cant = Number(cons[id]);
    if(!i || !(cant > 0)) continue;
    await movInv(id, signo>0 ? 'salida' : 'entrada', cant, {id: (origen||'venta') + '_' + refId + '_' + id + (signo>0 ? '' : '_rev'), origen: origen||'venta', ref: refId, nota: signo>0 ? 'Consumo por venta' : 'Devolución: venta borrada'});
  }
}
async function reintentarStockPendiente(){
  const qs = await db.collection('ventas').where('stockAplicado','==',false).get();
  for(const d of qs.docs){ await aplicarStock(d.data().consumos||{}, 1, d.id, 'venta'); await d.ref.update({stockAplicado:true}); }
}
function clasificar(nombre, detalles){
  const n = sinAcentos(nombre), d = sinAcentos((detalles||[]).join(' '));
  const t12 = /12 (oz|onzas)/.test(d) || /12 (oz|onzas)/.test(n), t9 = /9 (oz|onzas)/.test(d) || /9 (oz|onzas)/.test(n);
  if(/dubai/.test(n) && cfg.recetas.dubai9) return t12 ? 'dubai12' : 'dubai9';
  if(/pistacho pop/.test(n) && cfg.recetas.pistacho9) return t12 ? 'pistacho12' : 'pistacho9';
  for(const k of Object.keys(cfg.recetas)){            // postres con palabra clave (flan, jugo de fresa, canasta…)
    const m = sinAcentos(cfg.recetas[k].match).trim();
    if(m && n.includes(m)) return k;
  }
  if((n.includes('canasta') || d.includes('canasta pop')) && cfg.recetas.canasta) return 'canasta';
  if(t12 && cfg.recetas.grande) return 'grande';
  if(t9 && cfg.recetas.pequeno) return 'pequeno';
  return 'otro';
}
// Pedidos de la web que confirmaste en el panel: se convierten en venta con su costo
async function procesarVentasWeb(){
  const qs = await db.collection('ventas').where('procesada','==',false).get();
  for(const d of qs.docs){
    const v = d.data();
    const items = (v.items||[]).map(it=>({producto:clasificar(it.nombre, it.detalles), nombre:it.nombre, cantidad:it.cantidad||1, precio:it.precioUnit||0, ...inferirCtx(it.nombre, it.detalles)}));
    const {cons, costo, manoObra} = consumosDe(items);
    await d.ref.update({items, costo, manoObra, consumos:cons, procesada:true, stockAplicado:false});
    await aplicarStock(cons, 1, d.id, 'venta');
    await d.ref.update({stockAplicado:true});
  }
}

async function cargarAgenda(){ const s = await db.collection('agenda').get(); agenda = s.docs.map(d=>({id:d.id, ...d.data()})); }
const hoyIso = ()=> iso(new Date());
const diasHasta = fe=> Math.round((new Date(fe+'T12:00:00') - new Date(hoyIso()+'T12:00:00'))/864e5);
const pendientesAgenda = ()=> agenda.filter(e=>!e.hecho).sort((a,b)=> a.fecha < b.fecha ? -1 : 1);
const alertasAgenda = ()=> pendientesAgenda().filter(e=> diasHasta(e.fecha) <= (e.avisar===undefined ? 1 : Number(e.avisar)));
const ICONO = {pago:'💸', compra:'🛒', otro:'📌'};
function sumarPeriodo(fe, rep, n){
  const d = new Date(fe+'T12:00:00'), dia = d.getDate();
  if(rep==='semana') d.setDate(d.getDate() + 7*n);
  else if(rep==='mes'){ d.setDate(1); d.setMonth(d.getMonth()+n); d.setDate(Math.min(dia, new Date(d.getFullYear(), d.getMonth()+1, 0).getDate())); }
  else if(rep==='anio'){ d.setDate(1); d.setFullYear(d.getFullYear()+n); d.setDate(Math.min(dia, new Date(d.getFullYear(), d.getMonth()+1, 0).getDate())); }
  return iso(d);
}
function ocurrenciasMes(e, y, m){
  const ini = y+'-'+z2(m)+'-01', fin = y+'-'+z2(m)+'-'+z2(new Date(y,m,0).getDate()), out = [];
  if(!e.repite || e.repite==='no'){ if(e.fecha>=ini && e.fecha<=fin) out.push(e.fecha); return out; }
  let cur = e.fecha, n = 0;
  while(cur <= fin && n < 400){ if(cur >= ini) out.push(cur); n++; cur = sumarPeriodo(e.fecha, e.repite, n); }
  return out;
}
function vCalendario(){
  const [y,m] = calMes.split('-').map(Number), dias = new Date(y,m,0).getDate(), off = (new Date(y,m-1,1).getDay()+6)%7;
  const porDia = {};
  pendientesAgenda().forEach(e=> ocurrenciasMes(e,y,m).forEach(fe=> (porDia[fe] = porDia[fe] || []).push(e)));
  const nombres = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  let celdas = ['L','M','M','J','V','S','D'].map(x=>`<div class="h">${x}</div>`).join('') + '<div class="d vacio"></div>'.repeat(off);
  for(let d=1; d<=dias; d++){
    const fe = y+'-'+z2(m)+'-'+z2(d), ev = porDia[fe] || [], venc = ev.some(e=>e.fecha<hoyIso());
    celdas += `<div class="d ${fe===hoyIso()?'hoy':''} ${fe===calSel?'sel':''}" onclick="calSel='${fe}'; vCalendario()">${d}${ev.length?`<span class="pt">${ev.slice(0,3).map(()=>`<i class="${venc?'v':''}"></i>`).join('')}</span>`:''}</div>`;
  }
  const delDia = (porDia[calSel] || []);
  const prox = pendientesAgenda().filter(e=> diasHasta(e.fecha) <= 60);
  const card = (e, conFecha)=> `<div class="card"><div class="row"><div><div class="name">${ICONO[e.tipo]||'📌'} ${esc(e.titulo)}</div>
      <div class="sub">${conFecha ? e.fecha+' · ' : ''}${e.monto?money(e.monto)+' · ':''}${e.repite && e.repite!=='no' ? 'se repite cada '+{semana:'semana',mes:'mes',anio:'año'}[e.repite]+' · ' : ''}avisar ${Number(e.avisar||0)===0?'el mismo día':e.avisar+' día(s) antes'}${e.nota?'<br>'+esc(e.nota):''}</div></div>
      ${e.fecha<hoyIso()?'<span class="badge out">Vencido</span>':(e.fecha===hoyIso()?'<span class="badge low">Hoy</span>':'')}</div>
      <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;"><button class="mini" onclick="eventoHecho('${e.id}')">✅ Hecho</button><button class="mini" onclick="icsEvento('${e.id}')">📅 A mi celular</button><button class="mini" onclick="editarEvento('${e.id}')">Editar</button><button class="mini red" onclick="borrarEvento('${e.id}')">Borrar</button></div></div>`;
  $('#vista').innerHTML = `<div class="fecha"><button class="mini" onclick="calMes=sumarPeriodo(calMes+'-01','mes',-1).slice(0,7); vCalendario()">◀</button><div class="name" style="flex:1; text-align:center;">${nombres[m-1]} ${y}</div><button class="mini" onclick="calMes=sumarPeriodo(calMes+'-01','mes',1).slice(0,7); vCalendario()">▶</button></div>
    <div class="cal">${celdas}</div>
    <button class="btn" onclick="editarEvento(null)">+ Nuevo pago o compromiso</button>
    <div class="title">${calSel===hoyIso()?'Hoy':calSel}</div>${delDia.length ? delDia.map(e=>card(e,false)).join('') : '<div class="empty">Nada para este día.</div>'}
    <div class="title">Próximos 60 días</div>${prox.length ? prox.map(e=>card(e,true)).join('') : '<div class="empty">No tienes pagos ni compras pendientes.</div>'}`;
}

async function guardarEvento(id){
  const d = {titulo:$('#evT').value.trim(), tipo:$('#evTipo').value, fecha:$('#evF').value, monto:num($('#evM').value), repite:$('#evR').value, avisar:Number($('#evA').value), categoriaGasto:$('#evC').value, nota:$('#evN').value.trim(), hecho:false};
  if(!d.titulo || !d.fecha){ toast('Escribe qué es y la fecha'); return; }
  if(id){ Object.assign(agenda.find(x=>x.id===id), d); await db.collection('agenda').doc(id).update(d); }
  else { const ref = await db.collection('agenda').add(d); agenda.push({id:ref.id, ...d}); }
  calSel = d.fecha; calMes = d.fecha.slice(0,7);
  cerrar(); alertas(); vCalendario(); toast('Guardado ✅');
}
async function eventoHecho(id){
  const e = agenda.find(x=>x.id===id);
  if(e.tipo==='pago' && e.monto && confirm('¿Registrar este pago como gasto de hoy (' + money(e.monto) + ')?'))
    await db.collection('gastos').add({dia:hoyIso(), fecha:FV.serverTimestamp(), categoria:e.categoriaGasto||'Otros', descripcion:e.titulo, monto:e.monto, pago:'efectivo', proveedor:''});
  if(e.repite && e.repite!=='no'){ e.fecha = sumarPeriodo(e.fecha, e.repite, 1); await db.collection('agenda').doc(id).update({fecha:e.fecha}); toast('Listo ✅ Próxima fecha: ' + e.fecha, 3000); }
  else { e.hecho = true; await db.collection('agenda').doc(id).update({hecho:true}); toast('Listo ✅'); }
  alertas(); vCalendario();
}
async function borrarEvento(id){ if(!confirm('¿Borrar este recordatorio?')) return; await db.collection('agenda').doc(id).delete(); agenda = agenda.filter(x=>x.id!==id); alertas(); vCalendario(); }
function icsEvento(id){
  const e = agenda.find(x=>x.id===id), d = e.fecha.replace(/-/g,''), sig = sumarPeriodo(e.fecha,'semana',0) && iso(new Date(new Date(e.fecha+'T12:00:00').getTime()+864e5)).replace(/-/g,'');
  const avisar = Number(e.avisar||0), horas = avisar*24 - 9;                      // aviso a las 9:00 a. m.
  const alarma = avisar===0 ? 'TRIGGER;RELATED=START:PT9H' : 'TRIGGER:-PT' + horas + 'H';
  const clean = t=> String(t||'').replace(/[\\;,]/g, m=>'\\'+m).replace(/\n/g,' ');
  const rr = {semana:'FREQ=WEEKLY', mes:'FREQ=MONTHLY', anio:'FREQ=YEARLY'}[e.repite];
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Fresas Pop//Finanzas//ES','BEGIN:VEVENT','UID:'+e.id+'@fresaspop','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+sig,
    'SUMMARY:'+clean((ICONO[e.tipo]||'')+' '+e.titulo+(e.monto?' (RD$'+e.monto+')':'')), ...(rr?['RRULE:'+rr]:[]), ...(e.nota?['DESCRIPTION:'+clean(e.nota)]:[]),
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+clean(e.titulo),alarma,'END:VALARM','END:VEVENT','END:VCALENDAR'];
  descargar('recordatorio-'+slug(e.titulo)+'.ics', lines.join('\r\n'), 'text/calendar;charset=utf-8');
  toast('Ábrelo para agregarlo al calendario de tu celular', 3500);
}

    out.push({grupo, nombre:p.nombre||p.label, sizes, tipo:'plato'});
  });
  add('Favoritas', md.favoritas); add('Fresas Dubai', md.premium); add('Más postres', md.otros); add('Bebidas', md.bebidas);
  (md.categoriasExtra||[]).forEach(c=> add(c.nombre, c.items));
  const EXC = ['sin_topping','chispas_color','cono'];

}

function vsInc(ci, si, d){
  const c = catalogoVenta()[ci], s = c.sizes[si], nombre = nombreLinea(c, s), key = nombre + '|' + s.price;
  let l = ventaLineas.find(x=>x.key===key);
  if(!l){
    if(d < 0) return;
    const det = ['Tamaño: ' + s.label], ctx = inferirCtx(c.nombre, det);
    l = {key, nombre, cantidad:0, precio:s.price, producto: c.tipo==='plato' ? clasificar(c.nombre, det) : 'otro', crema:ctx.crema||null, base:ctx.base||null, complemento:ctx.complemento||null};
    ventaLineas.push(l);
  }
  l.cantidad += d; if(l.cantidad <= 0) ventaLineas = ventaLineas.filter(x=>x!==l);
  const q = document.getElementById('q-' + ci + '-' + si); if(q) q.textContent = qtyLinea(c, s);
  vsPintar();
}

  const bar = $('#vsBar'); if(bar) bar.style.display = ventaLineas.length ? 'flex' : 'none';
  const bt = $('#vsBarTxt'); if(bt) bt.textContent = 'Ventas brutas ' + money(bruto);

function vsLinea(k, d){
  const l = ventaLineas[k]; if(!l) return; l.cantidad += d; if(l.cantidad <= 0) ventaLineas.splice(k,1);
  catalogoVenta().forEach((c,ci)=> c.sizes.forEach((s,si)=>{ const q = document.getElementById('q-'+ci+'-'+si); if(q) q.textContent = qtyLinea(c,s); }));
  vsPintar();
}
function vsPagoPintar(){

async function guardarVentaLocal(){

function importarInventario(){
  abrir(`<h3>Importar inventario</h3><div class="sub" style="margin-bottom:8px;">Elige el archivo CSV (el que exportas desde aquí o uno hecho en Excel con las columnas Ingrediente, Categoría, Cantidad, Unidad, Costo unitario, Mínimo). Primero verás los cambios y confirmas.</div>
    <input id="impFile" type="file" accept=".csv,text/csv"><div class="acts"><button class="btn sec" onclick="cerrar()">Cancelar</button><button class="btn" onclick="leerImportInv()">Revisar</button></div>`);
}
function parseCSV(t){
  t = t.replace(/^\ufeff/, ''); const rows = []; let row = [], cur = '', q = false; const sep = (t.split('\n')[0].match(/;/g)||[]).length > (t.split('\n')[0].match(/,/g)||[]).length ? ';' : ',';
  for(let k=0; k<t.length; k++){ const c = t[k];
    if(q){ if(c==='"' && t[k+1]==='"'){ cur += '"'; k++; } else if(c==='"') q = false; else cur += c; }
    else if(c==='"') q = true; else if(c===sep){ row.push(cur); cur = ''; } else if(c==='\n' || c==='\r'){ if(c==='\r' && t[k+1]==='\n') k++; row.push(cur); cur = ''; if(row.some(x=>x!=='')) rows.push(row); row = []; } else cur += c; }
  if(cur!=='' || row.length){ row.push(cur); rows.push(row); } return rows;
}
let impCambios = [];
async function leerImportInv(){
  const fl = $('#impFile').files[0]; if(!fl){ toast('Elige un archivo'); return; }
  const rows = parseCSV(await fl.text()); if(rows.length < 2){ toast('El archivo está vacío'); return; }
  const h = rows[0].map(x=>sinAcentos(x).trim()), col = n=> h.findIndex(x=>x.includes(n));
  const cN = col('ingrediente'), cCat = col('categoria'), cC = col('cantidad'), cP = col('costo'), cM = col('minimo');
  if(cN < 0){ toast('No encuentro la columna "Ingrediente"'); return; }
  impCambios = [];
  rows.slice(1).forEach(r=>{
    const nombre = (r[cN]||'').trim(); if(!nombre) return;
    const baseN = t=> sinAcentos(String(t).replace(/\s*\(.*\)/,'')).trim();
    const i = insumos.find(x=>!x.preparacion && (x.nombre.toLowerCase()===nombre.toLowerCase() || baseN(x.nombre)===baseN(nombre)));
    const cant = cC>=0 && r[cC]!=='' ? num(r[cC]) : null, precio = cP>=0 && r[cP]!=='' ? num(String(r[cP]).replace(/[^0-9.]/g,'')) : null, min = cM>=0 && r[cM]!=='' ? num(r[cM]) : null;
    if(i){ const ch = []; if(cant!==null && cant !== Number(i.stock)) ch.push('cantidad ' + fnum(i.stock) + ' → ' + fnum(cant)); if(precio!==null && precio !== Number(i.precio)) ch.push('costo ' + money(i.precio) + ' → ' + money(precio)); if(min!==null && min !== Number(i.minimo)) ch.push('mínimo → ' + fnum(min)); if(ch.length) impCambios.push({i, nombre, cant, precio, min, txt:ch.join(' · '), nuevo:false}); }
    else impCambios.push({i:null, nombre, cant, precio, min, cat: cCat>=0 && CATS_INVENTARIO.includes(r[cCat]) ? r[cCat] : CATS_INVENTARIO[0], txt:'ingrediente nuevo', nuevo:true});
  });
  if(!impCambios.length){ toast('No hay cambios que aplicar'); return; }
  abrir(`<h3>Confirmar importación</h3><div style="max-height:46vh; overflow-y:auto;">${impCambios.map(c=>`<div class="row" style="padding:5px 0; border-bottom:1px solid #f6e6e9; font-size:12.5px;"><span>${esc(c.nombre)}</span><span class="sub">${c.txt}</span></div>`).join('')}</div><div class="acts"><button class="btn sec" onclick="cerrar()">Cancelar</button><button class="btn" onclick="aplicarImportInv()">Aplicar ${impCambios.length} cambio(s)</button></div>`);
}
async function aplicarImportInv(){
  for(const c of impCambios){
    if(c.nuevo){ const d = {nombre:c.nombre, categoria:c.cat, subcat:'', unidad:'unidad', precio:c.precio||0, rinde:1, porcion:'', minimo:c.min, stock:null, nota:''}; const ref = await db.collection('insumos').add(d); insumos.push({id:ref.id, ...d}); if(c.cant!==null) await fijarStock(ref.id, c.cant, 'Importado'); continue; }
    const upd = {}; if(c.precio!==null && c.precio !== Number(c.i.precio)){ c.i.historialPrecios = [...(c.i.historialPrecios||[]), {dia:iso(new Date()), precio:Number(c.i.precio)||0}].slice(-30); upd.precio = c.precio; upd.historialPrecios = c.i.historialPrecios; c.i.precio = c.precio; } if(c.min!==null){ upd.minimo = c.min; c.i.minimo = c.min; }
    if(Object.keys(upd).length) await db.collection('insumos').doc(c.i.id).update(upd);
    if(c.cant!==null && c.cant !== Number(c.i.stock)) await fijarStock(c.i.id, c.cant, 'Importado');
  }
  const n = impCambios.length; impCambios = []; snapshotCostos(); cerrar(); alertas(); vInventario(); toast(n + ' cambio(s) aplicados ✅');

function diffReceta(antes, ahora){
  const out = [], nom = l=> l.tipo==='fijo' ? l.nombre : ((insumos.find(x=>x.id===idLinea(l, DEFAULT_VAR))||{}).nombre||'?').replace(/ \(.*/,''), key = l=> l.tipo + ':' + (l.tipo==='fijo' ? l.nombre : (l.insumoId||l.variable));
  const a = Object.fromEntries(antes.map(l=>[key(l), l])), b = Object.fromEntries(ahora.map(l=>[key(l), l]));
  Object.keys(b).forEach(k=>{ if(!a[k]) out.push('Agregó ' + nom(b[k])); else { const x = b[k].tipo==='fijo' ? b[k].monto : b[k].cantidad, y = a[k].tipo==='fijo' ? a[k].monto : a[k].cantidad; if(Number(x) !== Number(y)) out.push(nom(b[k]) + ': ' + y + ' → ' + x); } });

  if(o.t==='p'){ await db.collection('insumos').doc(o.id).delete(); insumos = insumos.filter(x=>x.id!==o.id); } else { delete cfg.recetas[o.id]; await guardarCfg(); }
  costoSel = ''; costoBackupKey = ''; costoSucio = false; vCostos();
}
/* ----- buscador de ingredientes (filtra mientras escribes, sin duplicados) ----- */
let pickCb = null, pickExcl = [];
function pickInsumo(titulo, excl, cb){
  pickCb = cb; pickExcl = excl || [];
  abrir(`<h3>${titulo}</h3><input id="pkQ" type="search" placeholder="🔎 Escribe para buscar…" oninput="pkFiltrar()" autocomplete="off"><div id="pkLista" style="max-height:46vh; overflow-y:auto; margin-top:8px;"></div><div class="acts"><button class="btn sec" onclick="cerrar()">Cancelar</button></div>`);
  pkFiltrar(); setTimeout(()=>{ const q = $('#pkQ'); if(q) q.focus(); }, 120);
}
function pkFiltrar(){
  const q = sinAcentos($('#pkQ').value).trim();
  const L = insumos.filter(i=> !pickExcl.includes(i.id) && (!q || sinAcentos(i.nombre).includes(q))).slice(0,40);
  $('#pkLista').innerHTML = L.length ? L.map(i=>`<div class="row" style="padding:10px 4px; border-bottom:1px solid #f6e6e9; cursor:pointer;" onclick="pkElegir('${i.id}')"><span>${esc(i.nombre)}</span><span class="sub">${esc(i.porcion||i.unidad)}</span></div>`).join('') : '<div class="empty">Sin coincidencias</div>';
}
function pkElegir(id){ const cb = pickCb; cerrar(); if(cb) cb(id); }
/* ----- historial de costos (una foto por día, no se altera hacia atrás) ----- */
async function snapshotCostos(){
  try{
    const dia = iso(new Date()), b = db.batch();
    Object.keys(cfg.recetas).forEach(k=>{ const r = cfg.recetas[k]; b.set(db.collection('historial_costos').doc(k + '_' + dia), {clave:k, nombre:r.nombre, dia, ingredientes:Math.round(costoReceta(r, DEFAULT_VAR)*100)/100, precio:Number(r.precio)||0, manoObraPct:Number(cfg.indirectos.manoObra)||0}); });
    insumos.filter(i=>i.preparacion).forEach(i=> b.set(db.collection('historial_costos').doc(i.id + '_' + dia), {clave:i.id, nombre:i.nombre, dia, ingredientes:Math.round(costoPorUnidadStock(i)*100)/100, precio:0, manoObraPct:0}));
    await b.commit();
  }catch(e){}
}
async function verHistorialCostos(){
  const o = selActual(); if(!o) return;
  let h = []; try{ h = (await db.collection('historial_costos').where('clave','==',o.id).get()).docs.map(d=>d.data()); }catch(e){}
  h.sort((a,b)=> a.dia < b.dia ? 1 : (a.dia > b.dia ? -1 : ((b.ts&&b.ts.seconds||0) - (a.ts&&a.ts.seconds||0))));
  abrir(`<h3>Historial de costos</h3><div class="sub" style="margin-bottom:6px;">Cada vez que guardas cambios o cambia un precio se guarda una foto. Las ventas ya hechas no cambian.</div>
    <div style="max-height:50vh; overflow-y:auto;">${h.length ? h.map(x=>`<div style="padding:7px 0; border-bottom:1px solid #f6e6e9; font-size:12.5px;"><div class="row"><b>${x.dia}</b><span class="sub">costos directos ${money(x.ingredientes)}${x.precio?' · precio '+money(x.precio):''}${x.precioAnterior&&x.precioAnterior!==x.precio?' (antes '+money(x.precioAnterior)+')':''}</span></div>${(x.cambios||[]).length?'<div class="sub">'+x.cambios.map(esc).join(' · ')+'</div>':''}</div>`).join('') : '<div class="empty">Aún no hay historial.</div>'}</div>
    <div class="acts"><button class="btn sec" onclick="cerrar()">Cerrar</button></div>`);
}
function slug(t){ return String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'') || 'producto'; }
/* ================= CALCULADORA DE COSTOS ================= */
let calc = {nombre:'', lineas:[], margen:30, precio:''};
function vCalculadora(){
  const directo = sum(calc.lineas, l=>costoLinea(l)), mo = directo*pctMO(), total = directo + mo, mg = num(calc.margen)/100, rc = num(calc.recargo ?? 50)/100;
  const sugMargen = mg < 1 ? total/(1-mg) : 0, sugRecargo = total*(1+rc), sugRed = Math.ceil(sugMargen/5)*5;
  const precio = num(calc.precio) || sugRed, gan = precio - total, margenReal = precio ? gan/precio*100 : 0, pctCostos = precio ? total/precio*100 : 0;
  $('#vista').innerHTML = `<p class="sub" style="margin:0 0 8px;">Calcula cuánto cuesta un postre nuevo y a cómo venderlo. Los precios salen de tu inventario.</p>
    <div class="card"><div class="field"><label>Nombre del postre</label><input value="${esc(calc.nombre)}" placeholder="Ej. Flan" onchange="calc.nombre=this.value"></div>
    <div class="sub" style="margin-bottom:6px;">Lo que lleva</div>
    ${calc.lineas.map((l,idx)=> l.tipo==='fijo'
      ? `<div class="linea"><input value="${esc(l.nombre)}" onchange="calc.lineas[${idx}].nombre=this.value"><span class="sub">fijo</span><input type="number" inputmode="decimal" value="${l.monto}" onchange="calc.lineas[${idx}].monto=num(this.value); vCalculadora()"><button class="mini red" onclick="calc.lineas.splice(${idx},1); vCalculadora()">✕</button></div>`
      : `<div class="linea"><select onchange="calc.lineas[${idx}].insumoId=this.value; vCalculadora()">${insumos.map(i=>`<option value="${i.id}" ${i.id===l.insumoId?'selected':''}>${esc(i.nombre)}${i.porcion?' · '+esc(i.porcion):''}</option>`).join('')}</select><input type="number" inputmode="decimal" step="any" value="${l.cantidad}" onchange="calc.lineas[${idx}].cantidad=num(this.value); vCalculadora()"><span class="sub">${money(costoLinea(l))}</span><button class="mini red" onclick="calc.lineas.splice(${idx},1); vCalculadora()">✕</button></div>`).join('')}
    <div style="display:flex; gap:6px; margin:8px 0;"><button class="mini" onclick="calc.lineas.push({tipo:'insumo', insumoId:insumos[0].id, cantidad:1}); vCalculadora()">+ Insumo</button><button class="mini" onclick="calc.lineas.push({tipo:'fijo', nombre:'Otro costo', monto:0}); vCalculadora()">+ Costo fijo</button></div>
    <div class="grid2"><div class="field"><label>Margen deseado (%)</label><input type="number" inputmode="decimal" value="${calc.margen}" onchange="calc.margen=num(this.value); vCalculadora()"></div>
    <div class="field"><label>Recargo (%)</label><input type="number" inputmode="decimal" value="${calc.recargo ?? 50}" onchange="calc.recargo=num(this.value); vCalculadora()"></div></div>
    <div class="field"><label>Mi precio de venta (opcional)</label><input type="number" inputmode="decimal" value="${calc.precio}" placeholder="${sugRed||''}" onchange="calc.precio=this.value; vCalculadora()"></div></div>
    <div class="card"><div class="row"><span class="sub">Costos directos</span><b>${money(directo)}</b></div><div class="row"><span class="sub">Mano de obra (${Math.round(pctMO()*100)}% de los directos)</span><b>${money(mo)}</b></div><div class="row tot"><span>Costo total</span><span>${money(total)}</span></div>
      <div class="row" style="margin-top:8px;"><span class="sub">Precio con margen del ${calc.margen}%<br><span style="font-size:10.5px;">costo ÷ (1 − margen)</span></span><b>${money(sugMargen)}</b></div>
      <div class="row"><span class="sub">Precio con recargo del ${calc.recargo ?? 50}%<br><span style="font-size:10.5px;">costo × (1 + recargo)</span></span><b>${money(sugRecargo)}</b></div>
      <div class="row tot ${gan>=0?'pos':'neg'}" style="margin-top:8px;"><span>Con precio ${money(precio)}: ganancia</span><span>${money(gan)} · ${Math.round(margenReal)}%</span></div>
      <div class="sub">${Math.round(pctCostos)}% del precio se va en costos.</div>${gan<0 ? '<div class="alerta" style="margin:8px 0 0; max-width:none;">⚠️ Con este precio no se cubren los costos.</div>' : ''}</div>
    <div class="acts"><button class="btn sec" onclick="calc={nombre:'',lineas:[],margen:30,recargo:50,precio:''}; vCalculadora()">Limpiar</button><button class="btn" onclick="guardarCalculo()">Guardar como producto</button></div>`;
}
async function guardarCalculo(){
  const nombre = (calc.nombre||'').trim();
  if(!nombre){ toast('Ponle nombre al postre'); return; }
  const ind = pctIndirectos(), costo = sum(calc.lineas, costoLinea), mg = num(calc.margen)/100;
  const sugRed = (1-ind-mg) > 0 ? Math.ceil(costo/(1-ind-mg)/5)*5 : 0;
  let k = slug(nombre); while(cfg.recetas[k]) k += '_2';
  cfg.recetas[k] = {nombre, precio: num(calc.precio) || sugRed, match: nombre.toLowerCase(), lineas: JSON.parse(JSON.stringify(calc.lineas))};
  await guardarCfg(); calc = {nombre:'', lineas:[], margen:30, precio:''};
  toast('Producto guardado ✅ Ya puedes venderlo y se descuenta del inventario'); ir('costos');
}

/* ================= FOTO DE FACTURA ================= */
function comprimirFoto(file, maxW){
  return new Promise((res, rej)=>{
    const fr = new FileReader();
    fr.onload = ()=>{ const img = new Image(); img.onload = ()=>{
      const sc = Math.min(1, (maxW||1280)/Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      let q = .7, out = c.toDataURL('image/jpeg', q);
      while(out.length > 900000 && q > .3){ q -= .1; out = c.toDataURL('image/jpeg', q); }
      res(out); }; img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
async function adjuntarFactura(gastoId, inputId, dia){
  const inp = document.getElementById(inputId);
  if(!inp || !inp.files || !inp.files[0]) return false;
  try{
    const img = await comprimirFoto(inp.files[0]);
    await db.collection('facturas').doc(gastoId).set({img, dia, fecha:FV.serverTimestamp()});
    await db.collection('gastos').doc(gastoId).update({tieneFoto:true});
    return true;
  }catch(e){ toast('No se pudo guardar la foto', 3000); return false; }
}
async function verFactura(id){
  const s = await db.collection('facturas').doc(id).get(), d = s.exists ? s.data() : null;
  abrir(`<h3>Factura</h3>${d ? `<img src="${d.img}" style="width:100%; border-radius:12px;"><a class="btn sec" style="display:block; text-align:center; text-decoration:none; margin-top:8px;" href="${d.img}" download="factura-${id}.jpg">Descargar foto</a>` : '<div class="empty">Este gasto no tiene foto.</div>'}
    <div class="field" style="margin-top:10px;"><label>${d?'Reemplazar foto':'Agregar foto'}</label><input id="fvFile" type="file" accept="image/*" capture="environment"></div>
    <div class="acts"><button class="btn sec" onclick="cerrar()">Cerrar</button><button class="btn" onclick="guardarFotoGasto('${id}')">Guardar foto</button></div>`);
}

  if(ok){ cerrar(); toast('Foto guardada ✅'); ir(vistaActual); } else toast('Elige o toma una foto primero');

/* ================= EXPORTAR / RESPALDO ================= */
function csv(rows){ return '\ufeff' + rows.map(r=> r.map(c=>{ c = String(c==null?'':c); return /[",\n;]/.test(c) ? '"' + c.replace(/"/g,'""') + '"' : c; }).join(',')).join('\r\n'); }
function descargar(nombre, texto, tipo){
  const b = new Blob([texto], {type: tipo || 'text/csv;charset=utf-8'}), a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(a.href), 3000);
}
const fechaTs = t=> (t && t.toMillis) ? iso(new Date(t.toMillis())) : '';
function csvInventario(){
  const rows = [['Ingrediente','Categoría','Cantidad','Unidad','Costo unitario','Valor total','Mínimo','Vence']];
  insumos.filter(i=>!i.preparacion).forEach(i=> rows.push([i.nombre, i.categoria, i.stock==null?'':i.stock, i.unidad, i.precio, i.stock==null?'':Math.round(i.stock*(i.precio||0)*100)/100, i.minimo==null?'':i.minimo, i.vence||'']));
  return csv(rows);
}
function csvRecetas(){
  const rows = [['Producto','Precio de venta','Línea','Cantidad','Costo de la línea']];
  Object.keys(cfg.recetas).forEach(k=>{
    const r = cfg.recetas[k];
    r.lineas.forEach(l=>{
      const i = insumos.find(x=>x.id===idLinea(l, DEFAULT_VAR));
      rows.push([r.nombre, r.precio, l.tipo==='fijo' ? l.nombre : (l.tipo==='variable' ? '(' + l.variable + ') ' : '') + (i ? i.nombre : '?'), l.tipo==='fijo' ? '' : l.cantidad, Math.round(costoLinea(l, DEFAULT_VAR)*100)/100]);
    });
    const ing = costoReceta(r, DEFAULT_VAR), mo = pctMO()*ing0(r);
    rows.push([r.nombre, r.precio, 'INGREDIENTES','','', Math.round(ing*100)/100]);
    rows.push([r.nombre, r.precio, 'MANO DE OBRA ('+Math.round(pctMO()*100)+'% de los costos directos)','','', Math.round(mo*100)/100]);
    rows.push([r.nombre, r.precio, 'COSTO TOTAL DE PRODUCCIÓN','','', Math.round((ing+mo)*100)/100]);
  });
  return csv(rows);
}
function rangoExport(){ return {desde: $('#exDesde').value || '2000-01-01', hasta: $('#exHasta').value || '2999-12-31'}; }
async function exportarVentas(){
  const vs = await qRango('ventas', rangoExport());
  descargar('ventas.csv', csv([['Fecha','Origen','Cliente','Productos','Unidades','Total','Pago','Costo de recetas']].concat(
    vs.sort((a,b)=>a.dia<b.dia?-1:1).map(v=>[v.dia, v.origen||'', v.nombre||'', (v.items||[]).map(i=>i.cantidad+'x '+i.nombre).join(' + '), sum(v.items||[], i=>i.cantidad), v.total, v.pago||'', v.costo==null?'':Math.round(v.costo*100)/100]))));
  toast('Descargando ventas…');
}
async function exportarGastos(){
  const gs = await qRango('gastos', rangoExport());
  descargar('gastos.csv', csv([['Fecha','Categoría','Descripción','Monto','Pagado con','Proveedor','Tiene foto de factura']].concat(
    gs.sort((a,b)=>a.dia<b.dia?-1:1).map(g=>[g.dia, g.categoria, g.descripcion||'', g.monto, g.pago||'', g.proveedor||'', g.tieneFoto?'Sí':'No']))));

async function exportarTarjetas(){
  const qs = await db.collection('clientes').get();
  descargar('tarjetas-fidelidad.csv', csv([['Nombre','Teléfono','Compras confirmadas','Por confirmar','Último pedido','Premio','Premio usado']].concat(
    qs.docs.map(d=>{ const c = d.data(); return [c.nombre||'', c.telefono||d.id, c.puntos||0, c.pendientes||0, fechaTs(c.ultimoPedido), c.premio?c.premio.nombre:'', c.premio?(c.premio.usado?'Sí':'No'):'']; }))));
  toast('Descargando tarjetas…');
}
async function respaldoCompleto(){
  toast('Preparando respaldo… puede tardar un momento', 4000);
  const todo = {generado:new Date().toISOString(), config:cfg, insumos};
  for(const col of ['ventas','gastos','cierres','agenda','movimientos']){ const s = await db.collection(col).get(); todo[col] = s.docs.map(d=>({id:d.id, ...d.data()})); }
  const cs = await db.collection('clientes').get(); todo.clientes = [];
  for(const d of cs.docs){ const ps = await db.collection('clientes').doc(d.id).collection('pedidos').get(); todo.clientes.push({id:d.id, ...d.data(), pedidos: ps.docs.map(p=>({id:p.id, ...p.data()}))}); }
  const m = await db.collection('menu_data').doc('main').get(); todo.menu = m.exists ? m.data() : null;
  descargar('respaldo-fresaspop-' + iso(new Date()) + '.json', JSON.stringify(todo, (k,v)=> (v && v.toMillis) ? new Date(v.toMillis()).toISOString() : v, 1), 'application/json');
  toast('Respaldo descargado ✅');
}

function vAjustes(){
  $('#vista').innerHTML = `<div class="title" style="margin-top:0;">Costos</div><div class="card">
      <div class="field"><label>Mano de obra (% de los costos directos)</label><input type="number" inputmode="decimal" value="${cfg.indirectos.manoObra}" onchange="cfg.indirectos.manoObra=num(this.value)"></div>
      <div class="sub">Mano de obra = costos directos × este porcentaje (se aplica una sola vez). Es solo para calcular costos y precios: tu ganancia real sale de lo que vendes menos lo que gastas.</div></div>
    <div class="title">Web de pedidos</div><div class="card"><label style="font-size:13px; display:flex; gap:8px; align-items:flex-start;"><input type="checkbox" style="width:auto; margin-top:3px;" ${cfg.autoAgotado!==false?'checked':''} onchange="cfg.autoAgotado=this.checked; guardarCfg(); programarPublicar()"> Marcar como agotado en la web, automáticamente, lo que se acabe en el inventario (ingredientes, cremas, productos)</label></div>
    <button class="btn" style="margin-top:12px;" onclick="guardarAjustes()">Guardar ajustes</button>
    <div class="title" style="margin-top:26px;">Importar mi registro anterior</div><div class="card">
      <div class="sub" style="margin-bottom:8px;">Elige el archivo <b>fresaspop-registro-importar.json</b> (el que te preparé con tus movimientos de Fresas Pop). Se puede importar más de una vez sin duplicar.</div>
      <div class="field"><input type="file" id="impFile" accept=".json,application/json"></div>
      <button class="btn" onclick="importarRegistro()">Importar</button>
      <button class="btn red" style="margin-top:8px;" onclick="deshacerImportacion()">Deshacer importación</button>
      <div id="impOut" class="sub" style="margin-top:8px;"></div>
    </div>
    <div class="title" style="margin-top:26px;">Respaldo y exportación</div><div class="card">
      <div class="sub" style="margin-bottom:8px;">Todo ya vive en la nube y lo ves desde cualquier celular. Estos archivos son tu copia extra: se abren en Excel o Google Sheets. Te recomiendo bajar el respaldo completo una vez al mes.</div>
      <div class="grid2"><div class="field"><label>Desde</label><input type="date" id="exDesde" value="${iso(new Date(new Date().getFullYear(), new Date().getMonth(), 1))}"></div><div class="field"><label>Hasta</label><input type="date" id="exHasta" value="${iso(new Date())}"></div></div>
      <div class="grid2"><button class="mini" onclick="exportarVentas()">⬇ Ventas</button><button class="mini" onclick="exportarGastos()">⬇ Gastos</button>
        <button class="mini" onclick="descargar('inventario.csv', csvInventario())">⬇ Inventario</button><button class="mini" onclick="descargar('recetas-y-costos.csv', csvRecetas())">⬇ Recetas y costos</button>
        <button class="mini" onclick="exportarTarjetas()">⬇ Tarjetas de fidelidad</button></div>
      <button class="btn" style="margin-top:10px;" onclick="respaldoCompleto()">⬇ Respaldo completo (todo en un archivo)</button>
    </div>`;
}
async function importarRegistro(){
  const inp = $('#impFile'), out = $('#impOut');
  if(!inp.files[0]){ toast('Elige primero el archivo'); return; }
  let datos; try{ datos = JSON.parse(await inp.files[0].text()); }catch(e){ toast('El archivo no se pudo leer'); return; }
  if(!Array.isArray(datos.gastos) || !Array.isArray(datos.ventas)){ toast('Ese no es el archivo de importación'); return; }
  if(!confirm('Se van a importar ' + datos.ventas.length + ' ventas y ' + datos.gastos.length + ' gastos. ¿Continuar?')) return;
  const ts = d=> firebase.firestore.Timestamp.fromDate(new Date(d + 'T12:00:00'));
  const ops = [];
  datos.gastos.forEach(g=> ops.push([db.collection('gastos').doc(g.id), {dia:g.dia, fecha:ts(g.dia), categoria:g.categoria, descripcion:g.descripcion, monto:g.monto, pago:g.pago, proveedor:g.proveedor||'', nota:g.nota||'', cuentaOriginal:g.cuentaOriginal||'', inversion:!!g.inversion, origen:'importado'}]));
  datos.ventas.forEach(v=> ops.push([db.collection('ventas').doc(v.id), {dia:v.dia, fecha:ts(v.dia), origen:'importado', total:v.total, pago:v.pago, nombre:'', nota:v.nota||'', items:[{producto:'otro', nombre:v.descripcion||'Ventas del día', cantidad:1, precio:v.total}], costo:null, consumos:{}, procesada:true}]));
  try{
    for(let i=0; i<ops.length; i+=400){
      const b = db.batch(); ops.slice(i, i+400).forEach(([ref,d])=> b.set(ref, d)); await b.commit();
      out.textContent = 'Importando… ' + Math.min(i+400, ops.length) + ' de ' + ops.length;
    }
    out.innerHTML = '✅ Listo: ' + datos.ventas.length + ' ventas y ' + datos.gastos.length + ' gastos importados. Míralos en Resumen (mes) y en Gastos.';
    toast('Importación lista ✅', 3000);
  }catch(e){ out.textContent = 'No se pudo importar. Revisa que las reglas de Firestore estén publicadas.'; }
}
async function deshacerImportacion(){
  if(!confirm('¿Borrar TODO lo que se importó? (Tus ventas y gastos registrados a mano no se tocan.)')) return;
  const out = $('#impOut'); let n = 0;
  for(const col of ['gastos','ventas']){
    const s = await db.collection(col).where('origen','==','importado').get();
    for(let i=0; i<s.docs.length; i+=400){ const b = db.batch(); s.docs.slice(i,i+400).forEach(d=> b.delete(d.ref)); await b.commit(); }
    n += s.docs.length;
  }
  out.textContent = 'Se borraron ' + n + ' registros importados.'; toast('Importación deshecha');
}
async function guardarAjustes(){ await guardarCfg(); toast('Ajustes guardados ✅'); }
