<style>
:root{ --principal:#db5275; --vino:#56091f; --rojo:#b62d11; --crema:#fff3f4; --texto:#3a1420; --gris:#8a7378; --verde:#2e9e5b; --amar:#d98a00; --sombra:0 6px 18px rgba(86,9,31,.10); }
*{box-sizing:border-box;}
body{font-family:'Poppins',sans-serif; background:var(--crema); color:var(--texto); margin:0; padding:0 0 70px;}
h1,h2,h3,.brand{font-family:'Baloo 2',sans-serif;}
header{background:var(--vino); color:#fff; padding:14px 16px; text-align:center; position:sticky; top:0; z-index:20;}
header h1{margin:0; font-size:17px;} header{padding:11px 16px;}
body{padding-bottom:86px;}
#nav button.d:not(.m){display:none;}

#nav{position:fixed; left:0; right:0; bottom:0; background:#fff; display:flex; border-top:1px solid #f0d7dc; z-index:30; padding-bottom:env(safe-area-inset-bottom);}
#nav button{flex:1; border:none; background:none; padding:7px 2px 6px; font-size:10.5px; color:var(--gris); display:flex; flex-direction:column; align-items:center; gap:1px; font-family:inherit;}
#nav button .ic{font-size:19px; line-height:1.15; filter:grayscale(1); opacity:.65;} #nav button.active{color:var(--principal); font-weight:700;} #nav button.active .ic{filter:none; opacity:1;}
.fab{position:fixed; right:16px; bottom:76px; width:54px; height:54px; border-radius:50%; border:none; background:var(--principal); color:#fff; font-size:30px; line-height:1; box-shadow:0 6px 16px rgba(86,9,31,.3); z-index:29; display:none;}
.sub-tabs{display:flex; gap:6px; margin:0 0 10px;} .sub-tabs .chip{flex:1;}
.back{display:inline-block; font-size:13px; color:var(--principal); font-weight:600; margin:0 0 8px; cursor:pointer;}
.hgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.hc{display:flex; align-items:center; gap:9px; padding:10px 11px; background:#fff; border:1px solid #f0d7dc; border-radius:14px; cursor:pointer;} .hc:active{background:#fff0f3;}
.hc .ic{font-size:18px; width:28px; text-align:center; flex:none;} .hc b{display:block; font-size:13px; line-height:1.2;} .hc span.s{font-size:11px; color:var(--gris);}
@media (min-width:900px){ .hgrid{grid-template-columns:repeat(3,1fr);} }
.menu-item{display:flex; align-items:center; gap:12px; padding:13px 14px; background:#fff; border-radius:14px; box-shadow:var(--sombra); margin-bottom:9px; cursor:pointer;}
.menu-item .ic{font-size:22px;} .menu-item b{display:block; font-size:14px;} .menu-item span.s{font-size:12px; color:var(--gris);}
.logout{position:absolute; right:12px; top:16px; background:none; border:1.5px solid rgba(255,255,255,.6); color:#fff; font-size:12px; padding:4px 11px; border-radius:20px;}
.tabs{display:flex; gap:8px; overflow-x:auto; padding:12px 14px 0; scrollbar-width:none;} .tabs::-webkit-scrollbar{display:none;}
.tab{flex:none; padding:8px 14px; border-radius:20px; border:1.5px solid var(--principal); background:#fff; color:var(--principal); font-weight:600; font-size:13px; white-space:nowrap;}
.tab.active{background:var(--principal); color:#fff;}
.wrap{max-width:640px; margin:0 auto; padding:14px;}
.card{background:#fff; border-radius:16px; box-shadow:var(--sombra); padding:13px 15px; margin-bottom:11px;}
.row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.name{font-weight:600; font-size:14.5px;} .sub{font-size:12px; color:var(--gris); margin-top:2px;}
.title{font-size:15px; font-weight:700; color:var(--vino); margin:18px 0 8px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.stat{background:#fff; border-radius:14px; box-shadow:var(--sombra); padding:11px 13px;}
.stat .k{font-size:11.5px; color:var(--gris);} .stat .v{font-family:'Baloo 2',sans-serif; font-size:21px; font-weight:800; color:var(--vino);}
.stat.big{grid-column:1/-1; background:linear-gradient(135deg,#fff,#fff0f4);} .pos{color:var(--verde)!important;} .neg{color:var(--rojo)!important;}
.field{margin-bottom:10px;} .field label{display:block; font-size:12.5px; font-weight:600; margin-bottom:4px; color:var(--vino);}
input,select,textarea{width:100%; padding:10px; border-radius:10px; border:1.5px solid #eed3d8; font-size:14px; font-family:inherit; background:#fff;}
.btn{border:none; border-radius:12px; padding:11px 14px; font-weight:700; font-size:14px; background:var(--principal); color:#fff; width:100%;}
.btn.sec{background:#f0e2e4; color:var(--vino);} .btn.red{background:#fbdede; color:var(--rojo);}
.mini{border:none; border-radius:10px; padding:6px 11px; font-size:12px; font-weight:600; background:#f0e2e4; color:var(--vino);} .mini.red{background:#fbdede; color:var(--rojo);}
.chips{display:flex; gap:6px; margin:4px 0 10px;} .chip{flex:1; padding:7px; border-radius:20px; border:1.5px solid #eed3d8; background:#fff; font-size:12.5px; font-weight:600; text-align:center;}
.chip.on{background:var(--vino); border-color:var(--vino); color:#fff;}
.fecha{display:flex; gap:6px; align-items:center; margin-bottom:10px;} .fecha input{flex:1;}
.badge{font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:12px; background:#f0e2e4; color:var(--vino); white-space:nowrap;}
.badge.ok{background:#dff3e6; color:#1d7a43;} .badge.low{background:#fff0cc; color:#9a6200;} .badge.out{background:#fbdede; color:var(--rojo);} .badge.web{background:#e3ecff; color:#2c4fa8;}
.alerta{background:#fff0cc; border:1.5px solid #f0c24f; color:#7a4e00; border-radius:14px; padding:10px 13px; font-size:13px; margin:12px 14px 0; max-width:612px;}
@media(min-width:660px){.alerta{margin-left:auto; margin-right:auto;}}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:10px;} .cal .h{font-size:11px; text-align:center; color:var(--gris); font-weight:600;}
.cal .d{aspect-ratio:1; background:#fff; border-radius:10px; font-size:12.5px; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(86,9,31,.06); position:relative;}
.cal .d.hoy{border:2px solid var(--principal);} .cal .d.sel{background:var(--vino); color:#fff;} .cal .d.vacio{background:transparent; box-shadow:none;}
.cal .pt{display:flex; gap:2px; margin-top:2px;} .cal .pt i{width:6px; height:6px; border-radius:50%; background:var(--principal); display:block;} .cal .pt i.v{background:var(--rojo);}
.empty{text-align:center; color:var(--gris); font-size:13px; padding:18px 0;}
.overlay{position:fixed; inset:0; background:rgba(58,20,32,.5); display:none; align-items:flex-end; justify-content:center; z-index:60;} .overlay.on{display:flex;}
.modal{background:#fff; width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:18px; max-height:90vh; overflow-y:auto;}
.modal h3{margin:0 0 10px;} .acts{display:flex; gap:10px; margin-top:12px;} .acts .btn{flex:1;}
.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--vino); color:#fff; padding:10px 18px; border-radius:30px; font-size:13px; opacity:0; transition:.25s; pointer-events:none; z-index:100; max-width:90%; text-align:center;}
.toast.show{opacity:1;}
#login{max-width:340px; margin:70px auto; padding:24px; background:#fff; border-radius:16px; box-shadow:var(--sombra); text-align:center;}
#login input{margin:6px 0;} #login .btn{margin-top:8px;} #loginError{color:var(--rojo); font-size:13px; min-height:18px; margin-top:6px;}
.inv{background:#fff; border-radius:12px; box-shadow:var(--sombra); overflow:hidden; font-size:11px;}
.ir{display:grid; grid-template-columns:minmax(0,1fr) 34px 46px 38px 38px 42px; align-items:center; padding:7px 5px; border-bottom:1px solid #f6e6e9;}
.ir span{text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding-left:2px;} .ir span.nm{text-align:left;}
.ir.ih{background:var(--vino); color:#fff; font-weight:600; font-size:10.5px;}
.ir.row{cursor:pointer;} .ir .e{color:#1d7a43;} .ir .s{color:var(--rojo);} .ir.low .st{color:#9a6200; font-weight:700;} .ir.out .st{color:var(--rojo); font-weight:700;}
.ig{background:#fff3f4; padding:7px 8px; font-weight:700; color:var(--vino); font-size:12.5px; border-bottom:1px solid #f6e6e9;} .isg{background:#fffafb; padding:4px 8px; color:var(--gris); font-size:10.5px; font-weight:600; border-bottom:1px solid #f6e6e9;}
.cl{display:grid; grid-template-columns:minmax(0,1fr) 54px 34px 62px 60px 18px; gap:3px; align-items:center; padding:5px 0; border-bottom:1px solid #f6e6e9; font-size:12px;}
.cl input{padding:6px 4px; font-size:12px; text-align:right;} .cl.h{font-weight:700; color:var(--gris); font-size:10.5px; border-bottom:2px solid #f0d7dc;}
.cl span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;} .cl .nmb{text-align:left; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;} .cl .c{text-align:right;} .cl .x{background:none; border:none; color:var(--rojo); font-size:14px; padding:0;}
.vs-row{display:flex; align-items:center; gap:8px; padding:8px 2px; border-bottom:1px solid #f6e6e9;} .vs-n{flex:1; font-size:13px; font-weight:600; min-width:0;}
.vs-sz{text-align:center;} .vs-sz .sub{display:block; font-size:10.5px; margin:0 0 2px;} .stp{display:flex; align-items:center; gap:5px; justify-content:center;}
.stp button{width:27px; height:27px; border-radius:50%; border:none; background:#f0e2e4; color:var(--vino); font-weight:700; font-size:15px; line-height:1; padding:0;} .stp button.p{background:var(--principal); color:#fff;} .stp b{min-width:18px; text-align:center; font-size:13px;}
details.grp{background:#fff; border-radius:14px; box-shadow:var(--sombra); margin-bottom:9px; padding:2px 12px;} details.grp summary{padding:11px 0; font-weight:700; color:var(--vino); font-size:14px; cursor:pointer;}
.vsbar{position:sticky; bottom:72px; z-index:6; background:var(--vino); color:#fff; border-radius:14px; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; margin:10px 0; box-shadow:0 6px 16px rgba(86,9,31,.3);}
.vsbar button{background:#fff; color:var(--vino); border:none; border-radius:20px; padding:6px 12px; font-weight:700; font-size:12px;}
.mv{display:grid; grid-template-columns:92px minmax(0,1fr) auto; gap:8px; align-items:center; padding:9px 2px; border-bottom:1px solid #f6e6e9; cursor:pointer;}
.mv .mc{display:flex; align-items:center; gap:6px; min-width:0;} .mv .mc .e{font-size:18px;} .mv .mc .cn{font-size:11px; color:var(--gris); line-height:1.15; overflow:hidden;}
.mv .md{min-width:0; font-size:12.5px;} .mv .md div:first-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;} .mv b.in{color:#1d7a43;} .mv b.out{color:#b62d11;} .mv b.tr{color:#2f6fe0;}
.dh{display:flex; align-items:center; gap:7px; padding:12px 2px 5px; border-bottom:1px solid #eadadd; margin-top:6px;} .dh .dn{font-size:20px; font-weight:800; color:var(--vino);} .dh .wd{font-size:10.5px; padding:1px 7px; border-radius:6px; background:#9a8a8e; color:#fff;} .dh .wd.sa{background:#5b8def;} .dh .wd.do{background:#e8553a;}
.dh .my{font-size:11px; color:var(--gris);} .dh .tt{margin-left:auto; display:flex; gap:12px; font-size:12.5px; font-weight:700;}
.in{color:#1d7a43;} .out{color:#b62d11;} .tr{color:#2f6fe0;}
.sumbar{display:grid; grid-template-columns:repeat(3,1fr); text-align:center; background:#fff; border-radius:14px; box-shadow:var(--sombra); padding:10px 4px; margin:0 0 10px;} .sumbar .k{font-size:11px; color:var(--gris);} .sumbar .v{font-size:15px; font-weight:800;}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; font-size:9.5px;} .cal .wk{text-align:center; color:var(--gris); font-size:10.5px; padding:3px 0;}

/* ================= RESUMEN (simple: ¿cuánto vendí, gasté y gané?) ================= */
function rangoDe(per, ref, d0, h0){
  const d = new Date(ref+'T12:00:00');
  if(per==='todo') return {desde:'2000-01-01', hasta:'2100-12-31', txt:'Todo el tiempo'};
  if(per==='hoy') return {desde:ref, hasta:ref, txt: (ref===hoyIso()?'Hoy · ':'') + d.getDate() + ' ' + NOM_MES[d.getMonth()].slice(0,3) + ' ' + d.getFullYear()};
  if(per==='rango'){ const a = d0 || ref, b = h0 || ref; return {desde:a, hasta:b, txt:a + ' → ' + b}; }
  if(per==='anio') return {desde:d.getFullYear()+'-01-01', hasta:d.getFullYear()+'-12-31', txt:String(d.getFullYear())};
  if(per==='semana'){ const w = (d.getDay()+6)%7, a = new Date(d); a.setDate(d.getDate()-w); const b = new Date(a); b.setDate(a.getDate()+6); return {desde:iso(a), hasta:iso(b), txt:a.getDate()+' '+NOM_MES[a.getMonth()].slice(0,3)+' – '+b.getDate()+' '+NOM_MES[b.getMonth()].slice(0,3)+' '+b.getFullYear()}; }
  const a = new Date(d.getFullYear(), d.getMonth(), 1), b = new Date(d.getFullYear(), d.getMonth()+1, 0); return {desde:iso(a), hasta:iso(b), txt:NOM_MES[d.getMonth()]+' '+d.getFullYear()};
}
function rangoPrevio(per, r){
  if(per==='todo') return null;
  const a = new Date(r.desde+'T12:00:00'), b = new Date(r.hasta+'T12:00:00');
  if(per==='mes'){ const x = new Date(a.getFullYear(), a.getMonth()-1, 1), y = new Date(a.getFullYear(), a.getMonth(), 0); return {desde:iso(x), hasta:iso(y)}; }
  if(per==='anio') return {desde:(a.getFullYear()-1)+'-01-01', hasta:(a.getFullYear()-1)+'-12-31'};
  const dias = Math.round((b-a)/864e5) + 1, y = new Date(a); y.setDate(a.getDate()-1); const x = new Date(y); x.setDate(y.getDate()-dias+1); return {desde:iso(x), hasta:iso(y)};
}
const esCompraInv = g=> !!g.insumoId || /materia prima|empaques/i.test(g.categoria||'');
function calcPeriodo(vs, gs, is){
  const desde = cfg.inventarioDesde || '2000-01-01';
  const netas = sum(vs, v=>v.total), descuentos = sum(vs, v=>v.descuento||0), otros = sum(is.filter(x=>!esCapital(x)), x=>x.monto), capital = sum(is.filter(esCapital), x=>x.monto), propinas = sum(vs, v=>v.propina||0);

function necesidades(i, n){
  return i.preparacion.lineas.filter(l=>l.tipo==='insumo').map(l=>{
    const x = insumos.find(z=>z.id===l.insumoId); if(!x) return null;
    const need = (Number(l.cantidad)||0) * n / (Number(x.rinde)||1);
    const falta = (x.stock!==null && x.stock!==undefined && Number(x.stock) + 1e-9 < need);
    return {x, need, falta, sinConteo:(x.stock===null||x.stock===undefined)};
  }).filter(Boolean);
}
function pintarNecesidades(id){
  const i = insumos.find(x=>x.id===id), n = num($('#pdN').value), nec = necesidades(i, n), hayFalta = nec.some(r=>r.falta);
  const prod = n * (Number(i.preparacion.rinde)||1);
  $('#pdNec').innerHTML = `<div class="sub" style="margin-bottom:4px;">Produce ${fnum(prod)} ${esc(i.unidad)}${i.rinde>1?' (≈ '+fnum(prod*i.rinde)+' '+esc(i.porcion)+'s)':''} y usa:</div>` +
    nec.map(r=>`<div class="row" style="padding:4px 0; font-size:12.5px; border-bottom:1px solid #f6e6e9;"><span>${esc(r.x.nombre.replace(/ \(.*/,''))}</span><span style="color:${r.falta?'#b62d11':'inherit'};">${fnum(r.need)} ${esc(r.x.unidad)} ${r.falta?'⚠️ solo hay '+fnum(r.x.stock):(r.sinConteo?'<span class="sub">(sin conteo)</span>':'')}</span></div>`).join('') +
    (hayFalta ? '<div class="alerta" style="margin:8px 0 0;">No alcanza algún ingrediente. Compra más o prepara menos.</div>' : '');
  $('#pdGo').disabled = !(n > 0) || hayFalta; $('#pdGo').style.opacity = $('#pdGo').disabled ? .5 : 1;
}
async function producir(id){
  const p = insumos.find(x=>x.id===id), n = num($('#pdN').value);
  if(!(n > 0)){ toast('Escribe cuántas tandas'); return; }
  const nec = necesidades(p, n); if(nec.some(r=>r.falta)){ toast('No alcanza un ingrediente'); return; }
  const prodId = nuevoId('prod'), dia = iso(new Date()), cantidad = r3(n*(Number(p.preparacion.rinde)||1));
  try{
    await db.runTransaction(async tx=>{
      const prodRef = db.collection('producciones').doc(prodId), pRef = db.collection('insumos').doc(id);
      if((await tx.get(prodRef)).exists) return;
      const refs = nec.map(r=>db.collection('insumos').doc(r.x.id)), snaps = [];
      for(const r of refs) snaps.push(await tx.get(r));
      const pSnap = await tx.get(pRef);
      snaps.forEach((s,k)=>{ const d = s.data(); if(d.stock!==null && d.stock!==undefined && Number(d.stock) + 1e-9 < nec[k].need) throw new Error('SIN_STOCK'); });
      snaps.forEach((s,k)=>{
        const d = s.data(), antes = (d.stock===null||d.stock===undefined) ? null : Number(d.stock), despues = antes===null ? null : r3(antes - nec[k].need);
        if(antes!==null) tx.update(refs[k], {stock:despues});
        tx.set(db.collection('movimientos').doc(prodId + '_' + nec[k].x.id), {insumoId:nec[k].x.id, tipo:'salida', cantidad:r3(nec[k].need), delta:-r3(nec[k].need), dia, ts:FV.serverTimestamp(), origen:'producción', ref:prodId, nota:'Usado en ' + p.nombre.replace(/ \(.*/,''), stockAntes:antes, stockDespues:despues});
      });
      const pd = pSnap.data(), pAntes = (pd.stock===null||pd.stock===undefined) ? 0 : Number(pd.stock), pDespues = r3(pAntes + cantidad);
      tx.update(pRef, {stock:pDespues});
      tx.set(db.collection('movimientos').doc(prodId + '_' + id), {insumoId:id, tipo:'entrada', cantidad, delta:cantidad, dia, ts:FV.serverTimestamp(), origen:'producción', ref:prodId, nota:n + ' tanda(s) preparada(s)', stockAntes:pAntes, stockDespues:pDespues});
      tx.set(prodRef, {preparacionId:id, nombre:p.nombre, dia, ts:FV.serverTimestamp(), tandas:n, cantidad, unidad:p.unidad, rinde:p.rinde, porcion:p.porcion, ingredientes:nec.map(r=>({id:r.x.id, nombre:r.x.nombre, cantidad:r3(r.need), unidad:r.x.unidad})), costoTotal:Math.round(sum(p.preparacion.lineas, l=>costoLinea(l))*n*100)/100, estado:'activa', restante:cantidad, fechaAgotada:null, perdidas:0});
    });
  }catch(e){ toast(String(e.message).includes('SIN_STOCK') ? 'Cambió el inventario: no alcanza un ingrediente' : 'No se pudo guardar. Intenta de nuevo.', 3500); return; }
  const qs = await db.collection('insumos').get(); insumos = qs.docs.map(d=>({id:d.id, ...d.data()}));
  cerrar(); alertas(); vProduccion(); toast('Producción registrada ✅');
}

async function guardarFinalizar(prodId){
  const restante = Math.max(0, num($('#fpR').value)), ref = db.collection('producciones').doc(prodId), s = await ref.get(); if(!s.exists) return;
  const pr = s.data(), i = insumos.find(x=>x.id===pr.preparacionId), dia = iso(new Date());
  if(i && i.stock!==null && i.stock!==undefined && Number(i.stock) > restante) await movInv(i.id, 'perdida', r3(Number(i.stock)-restante), {origen:'pérdida', nota:'Sobrante descartado al finalizar', dia});
  await ref.update({estado:'agotada', fechaAgotada:dia, restante});
  cerrar(); alertas(); vProduccion(); toast('Producción finalizada ✅');
}
async function autoAgotar(insumoId){
  try{
    const qs = await db.collection('producciones').where('preparacionId','==',insumoId).get(), dia = iso(new Date());
    for(const d of qs.docs){ if(d.data().estado==='activa') await d.ref.update({estado:'agotada', fechaAgotada:dia, restante:0}); }
  }catch(e){}
}

/* ================= costos ================= */
const costoUnit = i=> i.preparacion ? sum(i.preparacion.lineas, l=>costoLinea(l)) / (Number(i.preparacion.rinde)||1) / (Number(i.rinde)||1) : (Number(i.precio)||0) / (Number(i.rinde)||1);
const costoPorUnidadStock = i=> costoUnit(i) * (Number(i.rinde)||1);
const DEFAULT_VAR = {crema:'crema_lista', base:'dulce_leche', complemento:'choco_negro'};
const BASE_INSUMO = {dulce_leche:'dulce_leche', leche_cond:'leche_condensada', syrup_caramelo:'caramelo', nutella:'nutella', pistacho:'pistacho_mezcla', choco_derretido:'choco_negro'};
const CREMA_INSUMO = {tradicional:'crema_lista', choco:'crema_choco', coco:'crema_coco'};
const TOPPING_INSUMO = {galletas:'galleta_choco', granola:'granola', chispas_choco:'chispas_choco', coco_rallado:'coco_rallado', kataifi:'kataifi', chispas_color:'chispas_color'};
const sinAcentos = t=> String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const idLinea = (l, ctx)=> l.tipo==='variable' ? ((ctx && ctx[l.variable]) || DEFAULT_VAR[l.variable]) : l.insumoId;
function costoLinea(l, ctx){
  if(l.tipo==='fijo') return Number(l.monto)||0;
  if(l.tipo==='variable' && idLinea(l, ctx)==='__ninguna') return 0;
  const i = insumos.find(x=>x.id===idLinea(l, ctx));
  const u = (l.costoManual!==undefined && l.costoManual!==null && l.costoManual!=='') ? Number(l.costoManual) : (i ? costoUnit(i) : 0);
  return (Number(l.cantidad)||0) * u;
}
const costoReceta = (r, ctx)=> sum(r.lineas, l=>costoLinea(l, ctx));
const ing0 = r=> costoReceta(r, DEFAULT_VAR);
const pctIndirectos = ()=> (sum(Object.values(cfg.indirectos), x=>x))/100;
const pctMO = ()=> (Number(cfg.indirectos.manoObra)||0)/100;
function baseDeTexto(m){
  if(/sin base/.test(m)) return '__ninguna';
  if(/nutella/.test(m)) return 'nutella'; if(/pistacho/.test(m)) return 'pistacho_mezcla'; if(/condensada/.test(m)) return 'leche_condensada';
  if(/caramelo/.test(m)) return 'caramelo'; if(/chocolate/.test(m)) return 'choco_negro'; return 'dulce_leche';
}
// ¿Qué crema y qué base lleva este pedido? (favoritas por su combinación; personalizadas y canasta por sus detalles)
function inferirCtx(nombre, detalles){
  const ctx = {}, nn = sinAcentos(nombre);
  (cfg.combos||[]).forEach(c=>{ if(new RegExp(c.match).test(nn)){ ctx.crema = c.crema; ctx.base = c.base; } });
  (detalles||[]).forEach(l=>{ const m = sinAcentos(l);
    if(/^crema:/.test(m)) ctx.crema = /choco/.test(m) ? 'crema_choco' : (/coco/.test(m) ? 'crema_coco' : 'crema_lista');
    else if(/^(base|syrup):/.test(m)) ctx.base = baseDeTexto(m);
    else if(/^complemento:|^que prefieres/.test(m)) ctx.complemento = /nutella/.test(m) ? 'nutella' : 'choco_negro';
  });
  return ctx;
}
function fijosDiarios(){
  let gasto = 0, ahorro = 0;
  cfg.fijos.forEach(f=>{
    if(f.activo === false) return;
    const d = f.per==='mes' ? f.monto/30 : (f.per==='anio' ? f.monto/365 : f.monto/7);
    if(f.ahorro) ahorro += d; else gasto += d;
  });
  return {gasto, ahorro};
}
function ensurePT(key){
  const r = cfg.recetas[key]; if(!r) return null; const id = 'pt_' + key;
  const lineas = r.lineas.map(l=> l.tipo==='fijo' ? {...l} : {tipo:'insumo', insumoId:idLinea(l, DEFAULT_VAR), cantidad:l.cantidad});
  let i = insumos.find(x=>x.id===id);
  if(!i){ i = {id, nombre:r.nombre + ' (preparado)', categoria:'Preparaciones', subcat:'', unidad:'unidad', rinde:1, porcion:'unidad', precio:0, minimo:null, stock:null, nota:'Producto terminado', preparacion:{rinde:1, lineas}}; insumos.push(i); const {id:_x, ...rest} = i; db.collection('insumos').doc(id).set(rest); }
  else { i.preparacion.lineas = lineas; i.nombre = r.nombre + ' (preparado)'; db.collection('insumos').doc(id).update({preparacion:i.preparacion, nombre:i.nombre}); }
  return i;
}
function consumosDe(items){
  const cons = {}; let costo = 0, manoObra = 0, sinReceta = 0;
  items.forEach(it=>{
    const r = cfg.recetas[it.producto];
    if(!r){ sinReceta += it.cantidad; return; }
    if(cfg.control && cfg.control[it.producto]==='terminado'){                     // se descuenta lo ya preparado, no los ingredientes (nunca las dos cosas)
      const pt = insumos.find(x=>x.id==='pt_'+it.producto);
      if(pt){ cons[pt.id] = (cons[pt.id]||0) + it.cantidad; const cu = costoUnit(pt); costo += cu*it.cantidad; manoObra += pctMO()*cu*it.cantidad; return; }
    }
    const ctx = {crema:it.crema, base:it.base, complemento:it.complemento};
    costo += costoReceta(r, ctx) * it.cantidad;
    manoObra += pctMO() * costoReceta(r, ctx) * it.cantidad;
    r.lineas.forEach(l=>{
      if(l.tipo==='fijo') return;
      const id = idLinea(l, ctx), i = insumos.find(x=>x.id===id);
      if(id==='__ninguna') return;
      if(i) cons[id] = (cons[id]||0) + (Number(l.cantidad)||0) * it.cantidad / (Number(i.rinde)||1);
    });
  });
  return {cons, costo, manoObra, sinReceta};
}
/* ================= INVENTARIO: libro de movimientos =================
   Cada entrada/salida se guarda como un movimiento con ID único, junto con el cambio de stock, en una sola transacción:
   si se repite la misma operación (recarga, mala señal) no se duplica. */
const r3 = x=> Math.round(x*1000)/1000;
const nuevoId = p=> p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
async function movInv(insumoId, tipo, cantidad, meta){
  meta = meta || {};
  const id = meta.id || nuevoId('mv'), dia = meta.dia || iso(new Date());
  const iRef = db.collection('insumos').doc(insumoId), mRef = db.collection('movimientos').doc(id);
  const res = await db.runTransaction(async tx=>{
    const mv = await tx.get(mRef); if(mv.exists) return {repetido:true};
    const ins = await tx.get(iRef); if(!ins.exists) return {faltante:true};
    const d = ins.data(), antes = (d.stock===null || d.stock===undefined) ? null : Number(d.stock);
    const delta = (tipo==='entrada' ? 1 : -1) * Number(cantidad);
    let despues = null;
    if(antes !== null){
      despues = r3(antes + delta);
      if(despues < 0){ if(meta.estricto) throw new Error('SIN_STOCK'); despues = 0; }
      tx.update(iRef, {stock: despues});
    }
    tx.set(mRef, {insumoId, tipo, cantidad:Number(cantidad), delta: antes===null ? delta : r3(despues-antes), dia, ts:FV.serverTimestamp(), origen:meta.origen||'manual', ref:meta.ref||'', nota:meta.nota||'', stockAntes:antes, stockDespues:despues, ...(meta.extra||{})});
    return {antes, despues};
  });
  if(res && res.despues !== undefined){ const i = insumos.find(x=>x.id===insumoId); if(i){ i.stock = res.despues; if(i.preparacion && res.despues !== null && res.despues <= 0) autoAgotar(insumoId); } }
  return res;
}
async function fijarStock(insumoId, nuevo, nota){
  const id = nuevoId('aj'), iRef = db.collection('insumos').doc(insumoId), mRef = db.collection('movimientos').doc(id);
  await db.runTransaction(async tx=>{
    const ins = await tx.get(iRef), d = ins.data(), antes = (d.stock===null || d.stock===undefined) ? null : Number(d.stock);
    const delta = antes===null ? nuevo : r3(nuevo - antes);
    tx.update(iRef, {stock:nuevo});
    if(delta !== 0) tx.set(mRef, {insumoId, tipo: antes===null ? 'inicial' : 'ajuste', cantidad:Math.abs(delta), delta, dia:iso(new Date()), ts:FV.serverTimestamp(), origen:'ajuste', ref:'', nota:nota||'Conteo', stockAntes:antes, stockDespues:nuevo});
  });
  const i = insumos.find(x=>x.id===insumoId); if(i) i.stock = nuevo;
}
function clasificar(nombre, detalles){
  const n = sinAcentos(nombre), d = sinAcentos((detalles||[]).join(' '));
  const t12 = /12 (oz|onzas)/.test(d) || /12 (oz|onzas)/.test(n), t9 = /9 (oz|onzas)/.test(d) || /9 (oz|onzas)/.test(n);
  if(/dubai/.test(n) && cfg.recetas.dubai9) return t12 ? 'dubai12' : 'dubai9';
  if(/pistacho pop/.test(n) && cfg.recetas.pistacho9) return t12 ? 'pistacho12' : 'pistacho9';
  for(const k of Object.keys(cfg.recetas)){            // postres con palabra clave (flan, jugo de fresa, canasta…)
    const m = sinAcentos(cfg.recetas[k].match).trim();
    if(m && n.includes(m)) return k;
  }
  if((n.includes('canasta') || d.includes('canasta pop')) && cfg.recetas.canasta) return 'canasta';
  if(t12 && cfg.recetas.grande) return 'grande';
  if(t9 && cfg.recetas.pequeno) return 'pequeno';
  return 'otro';
}

function estado(i){
  if(i.stock===null || i.stock===undefined) return 'sin';
  if(Number(i.stock) <= 0) return 'out';
  if(i.minimo!==null && i.minimo!==undefined && Number(i.stock) <= Number(i.minimo)) return 'low';
  return 'ok';
}

  $('#alertas').innerHTML = html;

/* ================= CALENDARIO (pagos y compromisos) ================= */
let agenda = [], calMes = iso(new Date()).slice(0,7), calSel = iso(new Date());
async function cargarAgenda(){ const s = await db.collection('agenda').get(); agenda = s.docs.map(d=>({id:d.id, ...d.data()})); }
const hoyIso = ()=> iso(new Date());
const diasHasta = fe=> Math.round((new Date(fe+'T12:00:00') - new Date(hoyIso()+'T12:00:00'))/864e5);
const pendientesAgenda = ()=> agenda.filter(e=>!e.hecho).sort((a,b)=> a.fecha < b.fecha ? -1 : 1);
const alertasAgenda = ()=> pendientesAgenda().filter(e=> diasHasta(e.fecha) <= (e.avisar===undefined ? 1 : Number(e.avisar)));
const ICONO = {pago:'💸', compra:'🛒', otro:'📌'};
function sumarPeriodo(fe, rep, n){
  const d = new Date(fe+'T12:00:00'), dia = d.getDate();
  if(rep==='semana') d.setDate(d.getDate() + 7*n);
  else if(rep==='mes'){ d.setDate(1); d.setMonth(d.getMonth()+n); d.setDate(Math.min(dia, new Date(d.getFullYear(), d.getMonth()+1, 0).getDate())); }
  else if(rep==='anio'){ d.setDate(1); d.setFullYear(d.getFullYear()+n); d.setDate(Math.min(dia, new Date(d.getFullYear(), d.getMonth()+1, 0).getDate())); }
  return iso(d);
}
function ocurrenciasMes(e, y, m){
  const ini = y+'-'+z2(m)+'-01', fin = y+'-'+z2(m)+'-'+z2(new Date(y,m,0).getDate()), out = [];
  if(!e.repite || e.repite==='no'){ if(e.fecha>=ini && e.fecha<=fin) out.push(e.fecha); return out; }
  let cur = e.fecha, n = 0;
  while(cur <= fin && n < 400){ if(cur >= ini) out.push(cur); n++; cur = sumarPeriodo(e.fecha, e.repite, n); }
  return out;
}
function vCalendario(){
  const [y,m] = calMes.split('-').map(Number), dias = new Date(y,m,0).getDate(), off = (new Date(y,m-1,1).getDay()+6)%7;
  const porDia = {};
  pendientesAgenda().forEach(e=> ocurrenciasMes(e,y,m).forEach(fe=> (porDia[fe] = porDia[fe] || []).push(e)));
  const nombres = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  let celdas = ['L','M','M','J','V','S','D'].map(x=>`<div class="h">${x}</div>`).join('') + '<div class="d vacio"></div>'.repeat(off);
  for(let d=1; d<=dias; d++){
    const fe = y+'-'+z2(m)+'-'+z2(d), ev = porDia[fe] || [], venc = ev.some(e=>e.fecha<hoyIso());
    celdas += `<div class="d ${fe===hoyIso()?'hoy':''} ${fe===calSel?'sel':''}" onclick="calSel='${fe}'; vCalendario()">${d}${ev.length?`<span class="pt">${ev.slice(0,3).map(()=>`<i class="${venc?'v':''}"></i>`).join('')}</span>`:''}</div>`;
  }
  const delDia = (porDia[calSel] || []);
  const prox = pendientesAgenda().filter(e=> diasHasta(e.fecha) <= 60);
  const card = (e, conFecha)=> `<div class="card"><div class="row"><div><div class="name">${ICONO[e.tipo]||'📌'} ${esc(e.titulo)}</div>
      <div class="sub">${conFecha ? e.fecha+' · ' : ''}${e.monto?money(e.monto)+' · ':''}${e.repite && e.repite!=='no' ? 'se repite cada '+{semana:'semana',mes:'mes',anio:'año'}[e.repite]+' · ' : ''}avisar ${Number(e.avisar||0)===0?'el mismo día':e.avisar+' día(s) antes'}${e.nota?'<br>'+esc(e.nota):''}</div></div>
      ${e.fecha<hoyIso()?'<span class="badge out">Vencido</span>':(e.fecha===hoyIso()?'<span class="badge low">Hoy</span>':'')}</div>
      <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;"><button class="mini" onclick="eventoHecho('${e.id}')">✅ Hecho</button><button class="mini" onclick="icsEvento('${e.id}')">📅 A mi celular</button><button class="mini" onclick="editarEvento('${e.id}')">Editar</button><button class="mini red" onclick="borrarEvento('${e.id}')">Borrar</button></div></div>`;
  $('#vista').innerHTML = `<div class="fecha"><button class="mini" onclick="calMes=sumarPeriodo(calMes+'-01','mes',-1).slice(0,7); vCalendario()">◀</button><div class="name" style="flex:1; text-align:center;">${nombres[m-1]} ${y}</div><button class="mini" onclick="calMes=sumarPeriodo(calMes+'-01','mes',1).slice(0,7); vCalendario()">▶</button></div>
    <div class="cal">${celdas}</div>
    <button class="btn" onclick="editarEvento(null)">+ Nuevo pago o compromiso</button>
    <div class="title">${calSel===hoyIso()?'Hoy':calSel}</div>${delDia.length ? delDia.map(e=>card(e,false)).join('') : '<div class="empty">Nada para este día.</div>'}
    <div class="title">Próximos 60 días</div>${prox.length ? prox.map(e=>card(e,true)).join('') : '<div class="empty">No tienes pagos ni compras pendientes.</div>'}`;
}
function editarEvento(id){
  const e = id ? agenda.find(x=>x.id===id) : {titulo:'', tipo:'pago', fecha:calSel, monto:'', repite:'no', avisar:1, nota:'', categoriaGasto:'🏩 Local'};
  abrir(`<h3>${id?'Editar':'Nuevo'} pago o compromiso</h3>
    <div class="field"><label>¿Qué es?</label><input id="evT" value="${esc(e.titulo)}" placeholder="Ej. Pagar la luz, Comprar crema"></div>
    <div class="grid2"><div class="field"><label>Tipo</label><select id="evTipo"><option value="pago" ${e.tipo==='pago'?'selected':''}>💸 Pago</option><option value="compra" ${e.tipo==='compra'?'selected':''}>🛒 Compra de insumos</option><option value="otro" ${e.tipo==='otro'?'selected':''}>📌 Otro</option></select></div>
    <div class="field"><label>Fecha</label><input id="evF" type="date" value="${e.fecha}"></div></div>
    <div class="grid2"><div class="field"><label>Monto (opcional)</label><input id="evM" type="number" inputmode="decimal" value="${e.monto||''}"></div>
    <div class="field"><label>Se repite</label><select id="evR"><option value="no" ${e.repite==='no'?'selected':''}>No</option><option value="semana" ${e.repite==='semana'?'selected':''}>Cada semana</option><option value="mes" ${e.repite==='mes'?'selected':''}>Cada mes</option><option value="anio" ${e.repite==='anio'?'selected':''}>Cada año</option></select></div></div>
    <div class="grid2"><div class="field"><label>Avisarme</label><select id="evA">${[[0,'El mismo día'],[1,'1 día antes'],[2,'2 días antes'],[3,'3 días antes'],[7,'7 días antes']].map(([v,t])=>`<option value="${v}" ${Number(e.avisar)===v?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="field"><label>Categoría del gasto</label><select id="evC">${CATEGORIAS_GASTO.map(c=>`<option ${e.categoriaGasto===c?'selected':''}>${c}</option>`).join('')}</select></div></div>
    <div class="field"><label>Nota (opcional)</label><input id="evN" value="${esc(e.nota||'')}"></div>
    <div class="acts"><button class="btn sec" onclick="cerrar()">Cancelar</button><button class="btn" onclick="guardarEvento(${id?`'${id}'`:'null'})">Guardar</button></div>`);
}
async function guardarEvento(id){
  const d = {titulo:$('#evT').value.trim(), tipo:$('#evTipo').value, fecha:$('#evF').value, monto:num($('#evM').value), repite:$('#evR').value, avisar:Number($('#evA').value), categoriaGasto:$('#evC').value, nota:$('#evN').value.trim(), hecho:false};
  if(!d.titulo || !d.fecha){ toast('Escribe qué es y la fecha'); return; }
  if(id){ Object.assign(agenda.find(x=>x.id===id), d); await db.collection('agenda').doc(id).update(d); }
  else { const ref = await db.collection('agenda').add(d); agenda.push({id:ref.id, ...d}); }
  calSel = d.fecha; calMes = d.fecha.slice(0,7);
  cerrar(); alertas(); vCalendario(); toast('Guardado ✅');
}
async function eventoHecho(id){
  const e = agenda.find(x=>x.id===id);
  if(e.tipo==='pago' && e.monto && confirm('¿Registrar este pago como gasto de hoy (' + money(e.monto) + ')?'))
    await db.collection('gastos').add({dia:hoyIso(), fecha:FV.serverTimestamp(), categoria:e.categoriaGasto||'Otros', descripcion:e.titulo, monto:e.monto, pago:'efectivo', proveedor:''});
  if(e.repite && e.repite!=='no'){ e.fecha = sumarPeriodo(e.fecha, e.repite, 1); await db.collection('agenda').doc(id).update({fecha:e.fecha}); toast('Listo ✅ Próxima fecha: ' + e.fecha, 3000); }
  else { e.hecho = true; await db.collection('agenda').doc(id).update({hecho:true}); toast('Listo ✅'); }
  alertas(); vCalendario();
}
async function borrarEvento(id){ if(!confirm('¿Borrar este recordatorio?')) return; await db.collection('agenda').doc(id).delete(); agenda = agenda.filter(x=>x.id!==id); alertas(); vCalendario(); }
function icsEvento(id){
  const e = agenda.find(x=>x.id===id), d = e.fecha.replace(/-/g,''), sig = sumarPeriodo(e.fecha,'semana',0) && iso(new Date(new Date(e.fecha+'T12:00:00').getTime()+864e5)).replace(/-/g,'');
  const avisar = Number(e.avisar||0), horas = avisar*24 - 9;                      // aviso a las 9:00 a. m.
  const alarma = avisar===0 ? 'TRIGGER;RELATED=START:PT9H' : 'TRIGGER:-PT' + horas + 'H';
  const clean = t=> String(t||'').replace(/[\\;,]/g, m=>'\\'+m).replace(/\n/g,' ');
  const rr = {semana:'FREQ=WEEKLY', mes:'FREQ=MONTHLY', anio:'FREQ=YEARLY'}[e.repite];
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Fresas Pop//Finanzas//ES','BEGIN:VEVENT','UID:'+e.id+'@fresaspop','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+sig,
    'SUMMARY:'+clean((ICONO[e.tipo]||'')+' '+e.titulo+(e.monto?' (RD$'+e.monto+')':'')), ...(rr?['RRULE:'+rr]:[]), ...(e.nota?['DESCRIPTION:'+clean(e.nota)]:[]),
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+clean(e.titulo),alarma,'END:VALARM','END:VEVENT','END:VCALENDAR'];
  descargar('recordatorio-'+slug(e.titulo)+'.ics', lines.join('\r\n'), 'text/calendar;charset=utf-8');
  toast('Ábrelo para agregarlo al calendario de tu celular', 3500);
}

function inferirSub(tipo, cat, desc){

async function migrarEtapa4(){
  const cambios = [], bk = {};
  for(const col of ['gastos','ingresos']){
    const tipo = col==='gastos' ? 'gasto' : 'ingreso', qs = await db.collection(col).get();
    qs.docs.forEach(d=>{
      const g = d.data(), nc = catCanon(tipo, g.categoria); let ns = g.subcategoria || '';
      if(!ns) ns = inferirSub(tipo, nc, g.descripcion);
      if(nc !== g.categoria || ns !== (g.subcategoria||'')){ bk[col[0] + '_' + d.id] = [g.categoria||'', g.subcategoria||'']; cambios.push([d.ref, {categoria:nc, subcategoria:ns}]); }
    });
  }
  if(cambios.length){
    const ks = Object.keys(bk); let n = 0;
    for(let i=0; i<ks.length; i+=1500){ const parte = {}; ks.slice(i, i+1500).forEach(k=>parte[k] = bk[k]); await db.collection('respaldos').doc('antes_etapa4_' + (n++)).set({fecha:iso(new Date()), datos:parte}); }
    for(let i=0; i<cambios.length; i+=400){ const b = db.batch(); cambios.slice(i, i+400).forEach(([r,d])=>b.update(r, d)); await b.commit(); }
  }
  cfg.etapa4 = true; await guardarCfg();
}

function persCalc(){

async function guardarVentaLocal(){

    pagos = cuentasCobro().map(c=>({cuenta:c.id, monto:num(ventaMixto[c.id])})).filter(p=>p.monto>0);
    if(Math.abs(sum(pagos, p=>p.monto) - total) > 0.01){ toast('El pago mixto debe sumar ' + money(total), 3500); return; }
  }
  guardandoVenta = true; const btn = $('#btnGuardarVenta'); if(btn){ btn.disabled = true; btn.style.opacity = .6; }

    const items = ventaLineas.map(l=>({producto:l.producto, nombre:l.nombre, cantidad:l.cantidad, precio:l.precio, crema:l.crema||null, base:l.base||null, complemento:l.complemento||null}));

    const firma = JSON.stringify(items.map(i=>[i.nombre, i.cantidad, i.precio]).sort()) + '|' + total;
    if(!editVentaId){
      const hoy = await qRango('ventas', {desde:diaSel, hasta:diaSel});
      if(hoy.some(v=>v.origen==='mostrador' && JSON.stringify((v.items||[]).map(i=>[i.nombre, i.cantidad, i.precio]).sort()) + '|' + v.total === firma) && !confirm('Ya guardaste una venta igual este día. ¿Guardar otra de todos modos?')) return;
    }

      await db.collection('ventas').doc(editVentaId).update({dia:diaSel, items, subtotal, descuento, descuentos:descs, motivoDescuento: descs.map(d=>d.motivo).join(' · '), descuentoVip: sum(descs.filter(d=>/vip/i.test(d.motivo)), d=>d.monto), propina, total, pago:ventaPago, pagos, costo: hayReceta ? costo : null, manoObra: hayReceta ? manoObra : null, consumos:cons, editado:FV.serverTimestamp()});

    await vref.set({dia:diaSel, fecha:FV.serverTimestamp(), origen:'mostrador', items, subtotal, descuento, descuentos:descs, motivoDescuento: descs.map(d=>d.motivo).join(' · '), descuentoVip: sum(descs.filter(d=>/vip/i.test(d.motivo)), d=>d.monto), propina, total, pago:ventaPago, pagos, costo: hayReceta ? costo : null, manoObra: hayReceta ? manoObra : null, consumos:cons, procesada:true});

/* ---------- importar / exportar (Excel abre el CSV) ---------- */
function importarInventario(){
  abrir(`<h3>Importar inventario</h3><div class="sub" style="margin-bottom:8px;">Elige el archivo CSV (el que exportas desde aquí o uno hecho en Excel con las columnas Ingrediente, Categoría, Cantidad, Unidad, Costo unitario, Mínimo). Primero verás los cambios y confirmas.</div>
    <input id="impFile" type="file" accept=".csv,text/csv"><div class="acts"><button class="btn sec" onclick="cerrar()">Cancelar</button><button class="btn" onclick="leerImportInv()">Revisar</button></div>`);
}
function parseCSV(t){
  t = t.replace(/^\ufeff/, ''); const rows = []; let row = [], cur = '', q = false; const sep = (t.split('\n')[0].match(/;/g)||[]).length > (t.split('\n')[0].match(/,/g)||[]).length ? ';' : ',';
  for(let k=0; k<t.length; k++){ const c = t[k];
    if(q){ if(c==='"' && t[k+1]==='"'){ cur += '"'; k++; } else if(c==='"') q = false; else cur += c; }
    else if(c==='"') q = true; else if(c===sep){ row.push(cur); cur = ''; } else if(c==='\n' || c==='\r'){ if(c==='\r' && t[k+1]==='\n') k++; row.push(cur); cur = ''; if(row.some(x=>x!=='')) rows.push(row); row = []; } else cur += c; }
  if(cur!=='' || row.length){ row.push(cur); rows.push(row); } return rows;
}
let impCambios = [];
async function leerImportInv(){
  const fl = $('#impFile').files[0]; if(!fl){ toast('Elige un archivo'); return; }
  const rows = parseCSV(await fl.text()); if(rows.length < 2){ toast('El archivo está vacío'); return; }
  const h = rows[0].map(x=>sinAcentos(x).trim()), col = n=> h.findIndex(x=>x.includes(n));
  const cN = col('ingrediente'), cCat = col('categoria'), cC = col('cantidad'), cP = col('costo'), cM = col('minimo');
  if(cN < 0){ toast('No encuentro la columna "Ingrediente"'); return; }
  impCambios = [];
  rows.slice(1).forEach(r=>{
    const nombre = (r[cN]||'').trim(); if(!nombre) return;
    const baseN = t=> sinAcentos(String(t).replace(/\s*\(.*\)/,'')).trim();
    const i = insumos.find(x=>!x.preparacion && (x.nombre.toLowerCase()===nombre.toLowerCase() || baseN(x.nombre)===baseN(nombre)));
    const cant = cC>=0 && r[cC]!=='' ? num(r[cC]) : null, precio = cP>=0 && r[cP]!=='' ? num(String(r[cP]).replace(/[^0-9.]/g,'')) : null, min = cM>=0 && r[cM]!=='' ? num(r[cM]) : null;
    if(i){ const ch = []; if(cant!==null && cant !== Number(i.stock)) ch.push('cantidad ' + fnum(i.stock) + ' → ' + fnum(cant)); if(precio!==null && precio !== Number(i.precio)) ch.push('costo ' + money(i.precio) + ' → ' + money(precio)); if(min!==null && min !== Number(i.minimo)) ch.push('mínimo → ' + fnum(min)); if(ch.length) impCambios.push({i, nombre, cant, precio, min, txt:ch.join(' · '), nuevo:false}); }
    else impCambios.push({i:null, nombre, cant, precio, min, cat: cCat>=0 && CATS_INVENTARIO.includes(r[cCat]) ? r[cCat] : CATS_INVENTARIO[0], txt:'ingrediente nuevo', nuevo:true});
  });
  if(!impCambios.length){ toast('No hay cambios que aplicar'); return; }
  abrir(`<h3>Confirmar importación</h3><div style="max-height:46vh; overflow-y:auto;">${impCambios.map(c=>`<div class="row" style="padding:5px 0; border-bottom:1px solid #f6e6e9; font-size:12.5px;"><span>${esc(c.nombre)}</span><span class="sub">${c.txt}</span></div>`).join('')}</div><div class="acts"><button class="btn sec" onclick="cerrar()">Cancelar</button><button class="btn" onclick="aplicarImportInv()">Aplicar ${impCambios.length} cambio(s)</button></div>`);
}
async function aplicarImportInv(){
  for(const c of impCambios){
    if(c.nuevo){ const d = {nombre:c.nombre, categoria:c.cat, subcat:'', unidad:'unidad', precio:c.precio||0, rinde:1, porcion:'', minimo:c.min, stock:null, nota:''}; const ref = await db.collection('insumos').add(d); insumos.push({id:ref.id, ...d}); if(c.cant!==null) await fijarStock(ref.id, c.cant, 'Importado'); continue; }
    const upd = {}; if(c.precio!==null && c.precio !== Number(c.i.precio)){ c.i.historialPrecios = [...(c.i.historialPrecios||[]), {dia:iso(new Date()), precio:Number(c.i.precio)||0}].slice(-30); upd.precio = c.precio; upd.historialPrecios = c.i.historialPrecios; c.i.precio = c.precio; } if(c.min!==null){ upd.minimo = c.min; c.i.minimo = c.min; }
    if(Object.keys(upd).length) await db.collection('insumos').doc(c.i.id).update(upd);
    if(c.cant!==null && c.cant !== Number(c.i.stock)) await fijarStock(c.i.id, c.cant, 'Importado');
  }
  const n = impCambios.length; impCambios = []; snapshotCostos(); cerrar(); alertas(); vInventario(); toast(n + ' cambio(s) aplicados ✅');
}

function comprimirFoto(file, maxW){
  return new Promise((res, rej)=>{
    const fr = new FileReader();
    fr.onload = ()=>{ const img = new Image(); img.onload = ()=>{
      const sc = Math.min(1, (maxW||1280)/Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      let q = .7, out = c.toDataURL('image/jpeg', q);
      while(out.length > 900000 && q > .3){ q -= .1; out = c.toDataURL('image/jpeg', q); }
      res(out); }; img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
async function subirComprobante(id, file, col, dia){

    await db.collection('facturas').doc(id).set({img, dia, col, fecha:FV.serverTimestamp()});
    await db.collection(col).doc(id).update({tieneFoto:true});

async function importarRegistro(){

  if(!confirm('Se van a importar ' + datos.ventas.length + ' ventas y ' + datos.gastos.length + ' gastos. ¿Continuar?')) return;
  const ts = d=> firebase.firestore.Timestamp.fromDate(new Date(d + 'T12:00:00'));
  const ops = [];
  datos.gastos.forEach(g=> ops.push([db.collection('gastos').doc(g.id), {dia:g.dia, fecha:ts(g.dia), categoria:g.categoria, descripcion:g.descripcion, monto:g.monto, pago:g.pago, proveedor:g.proveedor||'', nota:g.nota||'', cuentaOriginal:g.cuentaOriginal||'', inversion:!!g.inversion, origen:'importado'}]));

  try{
    for(let i=0; i<ops.length; i+=400){
      const b = db.batch(); ops.slice(i, i+400).forEach(([ref,d])=> b.set(ref, d)); await b.commit();

async function evolucionAnio(){

const UN = {g:['m',1], kg:['m',1000], lb:['m',453.592], oz:['m',28.3495], ml:['v',1], l:['v',1000], unidad:['c',1], paquete:['c',1], docena:['c',12]};

const FIJOS_CALC = {alquiler:5000, electricidad:2500, agua:0, internet:0, limpieza:1500, suscripciones:542, sueldo:0, ahorro:4333, otros:0, compromisos:0};   // alquiler 5,000 · luz 2,500 · limpieza 1,500 · Capcut 3,500/año + Canva 3,000/año = 542/mes · ahorro 1,000/semana ≈ 4,333/mes
const CALC_DEF = {fijos:JSON.parse(JSON.stringify(FIJOS_CALC)), unidades:0, mermaGlobal:5, moReceta:false, catalogo:[], recetas:[]};
const cc = ()=>{ if(!cfg.calc) cfg.calc = JSON.parse(JSON.stringify(CALC_DEF)); ['fijos','catalogo','recetas'].forEach(k=>{ if(!cfg.calc[k]) cfg.calc[k] = JSON.parse(JSON.stringify(CALC_DEF[k])); }); if(!cfg.calc.fijosV2){ const f = cfg.calc.fijos; Object.keys(FIJOS_CALC).forEach(k=>{ if(!(Number(f[k])>0) && FIJOS_CALC[k]>0) f[k] = FIJOS_CALC[k]; else if(f[k]===undefined) f[k] = FIJOS_CALC[k]; }); cfg.calc.fijosV2 = true; try{ guardarCfg().catch(()=>{}); }catch(e){} } return cfg.calc; };
const calcVacio = ()=>({id:'', nombre:'', rinde:1, lineas:[], materiales:[], margen:50, precio:''});
let calcR = calcVacio();
function costoUso(it, uso, unidadUso){
  const a = UN[it.unidadCompra], b = UN[unidadUso]; if(!a || !b || a[0] !== b[0]) return NaN;
  const base = (Number(it.cantCompra)||0) * a[1]; if(!(base > 0)) return NaN;
  return (Number(it.precio)||0) / base * (Number(uso)||0) * b[1];
}
const itemCalc = id=> cc().catalogo.find(x=>x.id===id);
function calcRes(R){
  const c = cc(), errores = [], aviso = [];
  const fijosMes = sum(Object.values(c.fijos), x=>x), unid = Number(c.unidades)||0, rinde = Number(R.rinde)||0, mg = Number(R.margen);
  let ing = 0, merma = 0, mat = 0;
  R.lineas.forEach(l=>{ const it = itemCalc(l.cid); if(!it) return; const k = costoUso(it, l.uso, l.unidad); if(isNaN(k)){ errores.push('Revisa la unidad de ' + it.nombre); return; }
    const m = l.merma==='' || l.merma==null ? (Number(c.mermaGlobal)||0) : (Number(l.merma)||0); ing += k; merma += k*m/100; });
  R.materiales.forEach(l=>{ const it = itemCalc(l.cid); if(!it) return; const k = costoUso(it, l.uso, l.unidad); if(isNaN(k)){ errores.push('Revisa la unidad de ' + it.nombre); return; } mat += k; });
  if(!(rinde > 0)) errores.push('Escribe cuántas unidades salen de la receta');
  if(!(unid > 0)) aviso.push('Escribe cuántas unidades vendes al mes (arriba) para repartir los costos fijos. Mientras tanto no se cargan.');
  if(isNaN(mg) || mg < 0 || mg >= 100) errores.push('El margen debe estar entre 0 y 99');
  const fijoUnit = unid > 0 ? fijosMes/unid : 0, fijosAsig = fijoUnit * (rinde > 0 ? rinde : 0);
  const mo = c.moReceta ? ing * pctMO() : 0;
  if(c.moReceta && Number(c.fijos.sueldo) > 0) aviso.push('⚠️ Ya incluiste el sueldo en costos fijos y además cobras mano de obra por receta: se está contando dos veces.');
  const total = ing + merma + mat + fijosAsig + mo, unitario = rinde > 0 ? total/rinde : 0;
  const ok = !errores.length && isFinite(unitario), sug = ok ? unitario/(1 - mg/100) : 0;
  const precio = Number(R.precio) > 0 ? Number(R.precio) : sug, gan = precio - unitario, margenReal = precio > 0 ? gan/precio*100 : 0, recargo = unitario > 0 ? (precio/unitario - 1)*100 : 0;
  const pesoFijos = (unid > 0 && precio > 0) ? fijosMes/(unid*precio)*100 : null;
  return {ing, merma, mat, fijosMes, unid, fijoUnit, fijosAsig, mo, total, unitario, sug, precio, gan, margenReal, recargo, pesoFijos, errores, aviso, ok, rinde};
}

async function unidadesDelMes(){
  try{

    const q = await db.collection('ventas').where('dia','>=', iso(d0)).get(); let n = 0;
    q.docs.forEach(x=>(x.data().items||[]).forEach(i=>{ n += Number(i.cantidad)||0; }));
    if(n > 0){ cc().unidades = n; await guardarCfg(); toast('Usé ' + n + ' unidades vendidas en 30 días ✅', 3000); vCalculadora(); }
    else toast('No encontré ventas con detalle en los últimos 30 días. Escribe el número a mano.', 3800);
  }catch(e){ toast('No pude leer las ventas. Escribe el número a mano.', 3500); }
}

async function agregarCalc(tipo){
  const nombre = $('#pcNom').value.trim(), cant = num($('#pcCC').value), pr = num($('#pcPr').value), uso = num($('#pcUso').value), uc = $('#pcUC').value, uu = $('#pcUU').value;
  if(!nombre){ toast('Escribe el nombre'); return; } if(!(cant > 0) || !(pr >= 0) || $('#pcPr').value===''){ toast('Escribe lo que compraste y su precio'); return; } if(!(uso > 0)){ toast('Escribe cuánto usa la receta'); return; }
  if(UN[uc][0] !== UN[uu][0]){ toast('La unidad de uso no coincide con la de compra (g/kg, ml/l, unidades)', 3500); return; }
  const c = cc(); let it = c.catalogo.find(x=>x.tipo===tipo && igual(x.nombre, nombre));
  if(!it){ it = {id:'ci_' + Date.now(), tipo, nombre, cat: tipo==='material' ? $('#pcCat').value : '', cantCompra:cant, unidadCompra:uc, precio:pr}; c.catalogo.push(it); }
  else { it.cantCompra = cant; it.unidadCompra = uc; it.precio = pr; }
  const arr = tipo==='material' ? calcR.materiales : calcR.lineas;
  if(arr.some(l=>l.cid===it.id)){ toast('Ya está en la receta'); return; }
  arr.push(tipo==='material' ? {cid:it.id, uso, unidad:uu} : {cid:it.id, uso, unidad:uu, merma:''});

}

const mpItem = id=> MP.items.find(x=>x.id===id), mpPrep = id=> MP.prep.find(x=>x.id===id);
function cpu(id, prof){                                   // costo por unidad base (null si falta algún precio)
  prof = prof||0; if(prof>6) return null;
  const m = mpItem(id); if(m) return (m.precio!=null && m.cant) ? m.precio/m.cant : null;
  const p = mpPrep(id); if(!p) return null; let t = 0;
  for(const c of p.comps){ const x = cpu(c.id, prof+1); if(x===null) return null; t += x*c.q; }
  return t/p.rinde;
}
function expandir(id, q, out, prof){
  prof = prof||0; if(prof>6) return out;
  if(mpItem(id)){ out[id] = (out[id]||0) + q; return out; }
  const p = mpPrep(id); if(p) p.comps.forEach(c=> expandir(c.id, c.q*q/p.rinde, out, prof+1));
  return out;
}
const nombreMP = id=> (mpItem(id)||mpPrep(id)||{n:id}).n;
const ubMP = id=> (mpItem(id)||{ub:'g'}).ub;
const fq = n=>{ const v = Math.round(n*100)/100; return v.toLocaleString('es-DO',{maximumFractionDigits:2}); };
const fcu = c=> c===null ? '—' : (c>=1 ? money(c) : 'RD$' + c.toFixed(4));
function costoFicha(f){
  let t = 0, falta = [];
  f.lineas.forEach(l=>{ const c = cpu(l.id); if(c===null) falta.push(nombreMP(l.id)); else t += c*l.q; });
  const gan = (f.precio!=null && !falta.length) ? f.precio - t : null;
  return {costo:t, falta, ganancia:gan, margen:(gan!==null && f.precio) ? gan/f.precio*100 : null, pctCosto:(f.precio && !falta.length) ? t/f.precio*100 : null};
}

function cuMP(i){                                        // unidad en la que se CUENTA (la de compra: paquete, caja, cubo…), no el peso
  let w = String(i.compra||'').trim().toLowerCase().replace(/\(.*$/,'').replace(/\s+de\s.*$/,'').replace(/\s*\d.*$/,'').trim();
  const f = Number(i.cant);

  return {u:w, f, w:true};
}
function plMP(u,q){ if(Math.abs(q-1)<1e-9 || /^medio /.test(u)) return u; if(/ón$/.test(u)) return u.slice(0,-2)+'ones'; if(/[aeio]$/.test(u)) return u+'s'; if(/d$/.test(u)) return u+'es'; return u; }
const r2c = x=> Math.round(x*100)/100;
const FRAC = [[0.25,'¼'],[0.5,'½'],[0.75,'¾']];
function partesMP(i, v){ const c = cuMP(i); if(!c.w || c.f<=1) return {n:null, rem:v, c}; const n = Math.floor(v/c.f + 1e-9); return {n, rem:r3b(v - n*c.f), c}; }

  const P = partesMP(i, v), n = P.n, rem = P.rem, hay = rem > 0.0005;
  if(n===null){ const q = r2c(v/c.f); return fnum(q) + ' ' + plMP(c.u, q); }
  let resto = '';
  if(hay){ const fr = FRAC.find(x=> Math.abs(rem/c.f - x[0]) < 0.03);
    resto = i.ub==='unidad' ? fnum(r2c(rem)) + (rem===1?' suelto':' sueltos') : (fr ? fr[1] : fnum(r2c(rem)) + ' ' + i.ub); }
  if(n===0) return hay ? (i.ub==='unidad' || !FRAC.find(x=> Math.abs(rem/c.f - x[0]) < 0.03) ? resto : resto + ' de ' + c.u) : '0 ' + plMP(c.u,0);
  return fnum(n) + ' ' + plMP(c.u, n) + (hay ? ' y ' + resto : '');
}

/* ---------- CIERRE DE CAJA (efectivo + inventario) ---------- */
const normN = t=> sinAcentos(t||'');
function fichaDeItem(it){
  const n = normN(it.nombre), tam = /12|grande/.test(n) ? 12 : (/\b9\b|peque/.test(n) ? 9 : 0);
  if(/\bextra\b/.test(n)){
    const m = [['nutella','nutella'],['dulce de leche','dulce_leche'],['condensada','leche_condensada'],['pistacho','pistacho_mezcla'],['chispas','chispas_choco'],['granola','granola'],['katai','kataifi_tostado'],['galleta','galleta_choco']].find(([w])=>n.includes(w));
    return m ? MP.fichas.find(f=>f.k==='extra_'+m[1]) : null;
  }
  if(/canasta/.test(n)) return MP.fichas.find(f=>f.k==='canasta');
  if(/\bflan\b/.test(n)) return MP.fichas.find(f=>f.k==='flan');
  const key = /dubai/.test(n) ? 'dubai' : /clasica/.test(n) ? 'clasica' : /balance/.test(n) ? 'balance' : /paradise/.test(n) ? 'paradise' : /duo ?pop/.test(n) ? 'duopop' : /oasis/.test(n) ? 'oasis' : /choco ?pop/.test(n) ? 'chocopop' : /nut(i|t?y) ?pop/.test(n) ? 'nutipop' : null;
  return (key && tam) ? MP.fichas.find(f=>f.k===key+tam) : null;
}
function calcularConsumo(vs){
  const cons = {}, prods = {}, sinFicha = {};
  vs.forEach(v=>(v.items||[]).forEach(it=>{
    const c = Number(it.cantidad)||0; if(!c) return;
    if(v.origen==='importado') return;
    const f = fichaDeItem(it);
    if(!f){ sinFicha[it.nombre] = (sinFicha[it.nombre]||0) + c; return; }
    prods[f.n + ' ' + f.t] = (prods[f.n + ' ' + f.t]||0) + c;
    f.lineas.forEach(l=> expandir(l.id, l.q*c, cons));
  }));
  Object.keys(cons).forEach(k=> cons[k] = r3b(cons[k]));
  return {cons, prods, sinFicha};
}
let cierreMerma = [], cierreDia = '';
async function vCierre(){
  $('#vista').innerHTML = navDia() + '<div class="empty">Cargando…</div>';
  try{ await mpCargar(); }catch(e){}
  try{ await eqImportarVentas(); await eqSync(); }catch(e){}
  const r = {desde:diaSel, hasta:diaSel}, safe = p=> p.catch(()=>[]), [vs, gs, is] = await Promise.all([qRango('ventas', r), qRango('gastos', r), safe(qRango('ingresos', r))]);
  const cs = await db.collection('cierres').doc(diaSel).get(), c = cs.exists ? cs.data() : {}, inv = c.inv || {estado:'borrador', rev:0};
  if(cierreDia !== diaSel){ cierreDia = diaSel; cierreMerma = (inv.estado==='confirmado' ? inv.mermas : inv.mermas) || []; }
  const brutas = sum(vs, v=>(v.total||0)+(v.descuento||0)), desc = sum(vs, v=>v.descuento||0), netas = sum(vs, v=>v.total), gastos = sum(gs.filter(g=>!esAhorro(g)), g=>g.monto), gastosEf = sum(gs.filter(g=>cuentaDe(g.pago)==='efectivo'), g=>g.monto);
  const efV = sum(vs, v=>montoEnCuenta(v,'efectivo')) + sum(vs, v=>cuentaDe(v.pago)==='efectivo' ? (v.propina||0) : 0) + sum(is.filter(x=>cuentaDe(x.pago)==='efectivo'), x=>x.monto);
  const trf = sum(cuentas().filter(x=>x.id!=='efectivo'), cu=> sum(vs, v=>montoEnCuenta(v, cu.id)) + sum(is.filter(x=>cuentaDe(x.pago)===cu.id), x=>x.monto));
  const esperado = num(c.inicial) + efV - gastosEf, dif = (c.final!==undefined && c.final!=='') ? num(c.final) - esperado : null;
  const calc = calcularConsumo(vs), conf = inv.estado==='confirmado', consumos = conf ? inv.consumos : calc.cons;
  const total = {...consumos}; (cierreMerma||[]).forEach(m=>{ total[m.id] = r3b((total[m.id]||0) + num(m.q)); });
  const cambio = conf && JSON.stringify(calc.cons) !== JSON.stringify(inv.consumos);
  const filas = Object.keys(total).sort((a,b)=>nombreMP(a).localeCompare(nombreMP(b))).map(id=>{ const it = mpItem(id) || {}, q = total[id], st = it.stock, falta = !conf && st!=null && st < q;
    return `<div class="row" style="font-size:13px; padding:3px 0;"><span style="flex:1;">${esc(nombreMP(id))}</span><span style="width:90px; text-align:right;">${fq(q)} ${esc(ubMP(id))}</span><span class="${falta?'out':'sub'}" style="width:100px; text-align:right;">${conf ? '' : (st==null ? 'sin contar' : 'queda ' + fq(Math.max(0, st-q)))}</span></div>`; }).join('');
  const avisos = [];
  Object.keys(calc.sinFicha).forEach(n=> avisos.push(`“${esc(n)}” ×${calc.sinFicha[n]}: no tiene ficha, no descuenta inventario`));
  if(!conf) Object.keys(total).forEach(id=>{ const it = mpItem(id); if(it && it.stock==null) avisos.push(`${esc(it.n)}: sin stock contado, no se descuenta`); else if(it && it.stock<total[id]) avisos.push(`${esc(it.n)}: el stock (${fq(it.stock)}) no alcanza para ${fq(total[id])}`); });

  const mermaHtml = (cierreMerma||[]).map((m,ix)=>`<div class="row" style="font-size:13px;"><span style="flex:1;">${esc({merma:'Merma',desperdicio:'Desperdicio',interno:'Consumo interno'}[m.tipo])}: ${esc(nombreMP(m.id))} · ${fq(m.q)} ${esc(ubMP(m.id))}</span>${conf?'':`<button class="mini sec" onclick="mermaQuitar(${ix})">✕</button>`}</div>`).join('');
  $('#vista').innerHTML = navDia() + `<div class="card"><div class="title" style="margin-top:0;">Cierre del día ${conf?'· ✅ confirmado':'· borrador'}</div>
    <div class="row"><span class="sub">Ventas brutas</span><b>${money(brutas)}</b></div><div class="row"><span class="sub">Descuentos</span><b>−${money(desc)}</b></div><div class="row tot"><span>Ventas netas</span><span>${money(netas)}</span></div>
    <div class="row"><span class="sub">Gastos del día</span><b class="out">${money(gastos)}</b></div><div class="row"><span class="sub">Transferencias recibidas</span><b>${money(trf)}</b></div>
    <div class="grid2" style="margin-top:8px;"><div class="field"><label>Efectivo inicial</label><input id="cInicial" type="number" inputmode="decimal" value="${c.inicial??''}"></div><div class="field"><label>Efectivo final (contado)</label><input id="cFinal" type="number" inputmode="decimal" value="${c.final??''}"></div></div>
    <div class="sub">Ventas en efectivo (con propinas): ${money(efV)} · Gastos en efectivo: ${money(gastosEf)}</div><div class="row tot"><span>Efectivo esperado</span><span>${money(esperado)}</span></div>
    ${dif!==null ? `<div class="row ${dif>=0?'pos':'neg'}"><span>Diferencia de caja</span><b>${money(dif)}</b></div>` : ''}
    <button class="btn" style="margin-top:10px;" onclick="guardarCierre(${brutas},${desc},${netas},${gastos},${esperado},${trf})">Guardar efectivo</button></div>
    <div class="card"><div class="title" style="margin-top:0;">Lo vendido hoy</div>${Object.keys(calc.prods).length ? Object.keys(calc.prods).map(k=>`<div class="row" style="font-size:13px;"><span>${esc(k)}</span><b>${calc.prods[k]}</b></div>`).join('') : '<div class="sub">No hay ventas con ficha este día.</div>'}</div>
    <div class="card"><div class="title" style="margin-top:0;">Inventario que se descuenta</div>${filas || '<div class="sub">Nada que descontar.</div>'}
      ${mermaHtml ? `<div class="sub" style="margin-top:8px;">Aparte de las ventas:</div>${mermaHtml}` : ''}
      ${conf ? '' : `<button class="btn sec" style="margin-top:8px;" onclick="mermaNueva()">+ Merma, desperdicio o consumo interno</button>`}
      ${avisos.length ? `<div class="alerta" style="margin-top:8px;">${avisos.map(a=>'⚠️ '+a).join('<br>')}</div>` : ''}
      <div class="acts" style="margin-top:10px;">${conf ? `<button class="btn red" onclick="revertirCierre()">Revertir cierre</button>` : `<button class="btn sec" onclick="guardarBorradorInv()">Guardar borrador</button><button class="btn" onclick="confirmarCierre()">Confirmar cierre</button>`}</div>
      <div class="sub" style="margin-top:6px;">El inventario se descuenta <b>una sola vez</b>, cuando confirmas. ${conf ? 'Confirmado el ' + esc(inv.dia||'') + '. Si te equivocaste, revierte y vuelve a confirmar.' : 'Mientras no confirmes, puedes editar las ventas del día.'}</div></div>`;
  $('#vista').insertAdjacentHTML('afterbegin', `<a class="back" onclick="ir('mas')">‹ Más</a>`);
}
function mermaNueva(){
  abrir(`<h3>Merma, desperdicio o consumo interno</h3><div class="field"><label>Tipo</label><select id="mmT"><option value="merma">Merma</option><option value="desperdicio">Desperdicio</option><option value="interno">Consumo interno</option></select></div>

function mermaAgregar(){ const q = num($('#mmQ').value); if(!(q>0)){ toast('Pon la cantidad'); return; } cierreMerma.push({tipo:$('#mmT').value, id:$('#mmI').value, q}); cerrar(); vCierre(); }

async function guardarBorradorInv(){ const r = db.collection('cierres').doc(diaSel), sn = await r.get(), inv = (sn.exists && sn.data().inv) || {}, d = {inv:{estado:'borrador', rev:inv.rev||0, mermas:cierreMerma, dia:diaSel}}; if(sn.exists) await r.update(d); else await r.set(d); toast('Borrador guardado'); vCierre(); }
let cerrandoInv = false;
async function confirmarCierre(){
  if(cerrandoInv) return;
  const vs = await qRango('ventas', {desde:diaSel, hasta:diaSel}), calc = calcularConsumo(vs);
  const total = {...calc.cons}; cierreMerma.forEach(m=>{ total[m.id] = r3b((total[m.id]||0) + num(m.q)); });
  if(!Object.keys(total).length){ toast('No hay nada que descontar'); return; }
  if(!confirm('¿Confirmar el cierre del ' + diaSel + '? El inventario se descuenta una sola vez.')) return;
  cerrandoInv = true; const dia = diaSel, CREF = db.collection('cierres').doc(dia);
  try{
    await db.runTransaction(async tx=>{
      const cs = await tx.get(CREF), inv = (cs.exists && cs.data().inv) || {};
      if(inv.estado==='confirmado') throw new Error('YA');
      const ms = await tx.get(MPREF), d = ms.data(), rev = (inv.rev||0) + 1, aplicado = {};

        const it = d.items.find(x=>x.id===id); if(!it) return;
        if(it.stock==null){ aplicado[id] = 0; return; }
        const nuevo = Math.max(0, r3b(it.stock - total[id])); aplicado[id] = r3b(it.stock - nuevo); it.stock = nuevo;
        tx.set(db.collection('movimientos').doc('cierre_' + dia + '_' + rev + '_' + id), {insumoId:id, tipo:'cierre', cantidad:total[id], delta:-aplicado[id], dia, ts:FV.serverTimestamp(), origen:'cierre', ref:dia, nota:'Cierre de caja ' + dia, stockDespues:nuevo});
      });
      tx.set(MPREF, d);
      const nuevoInv = {inv:{estado:'confirmado', rev, dia:iso(new Date()), consumos:calc.cons, mermas:cierreMerma, aplicado, total, ventas:calc.prods}};
      if(cs.exists) tx.update(CREF, nuevoInv); else tx.set(CREF, nuevoInv);
    });
    await mpCargar(true); toast('Cierre confirmado ✅', 3000);
  }catch(e){ toast(e.message==='YA' ? 'Ese cierre ya estaba confirmado' : 'No se pudo confirmar el cierre', 3500); }
  finally{ cerrandoInv = false; }
  vCierre();
}
async function revertirCierre(){
  if(cerrandoInv) return; if(!confirm('¿Revertir el cierre? El inventario vuelve a como estaba antes de confirmarlo.')) return;
  cerrandoInv = true; const dia = diaSel, CREF = db.collection('cierres').doc(dia);
  try{
    await db.runTransaction(async tx=>{
      const cs = await tx.get(CREF), inv = (cs.exists && cs.data().inv) || {};
      if(inv.estado!=='confirmado') throw new Error('NO');
      const ms = await tx.get(MPREF), d = ms.data();
      Object.keys(inv.aplicado||{}).forEach(id=>{
        const it = d.items.find(x=>x.id===id), a = inv.aplicado[id]; if(!it || !a || it.stock==null) return;
        it.stock = r3b(it.stock + a);
        tx.set(db.collection('movimientos').doc('cierre_' + dia + '_' + inv.rev + '_' + id + '_rev'), {insumoId:id, tipo:'reversa', cantidad:a, delta:a, dia, ts:FV.serverTimestamp(), origen:'cierre', ref:dia, nota:'Reversa del cierre ' + dia, stockDespues:it.stock});
      });
      tx.set(MPREF, d);
      tx.update(CREF, {inv:{estado:'borrador', rev:inv.rev, dia, mermas:inv.mermas||[], revertido:iso(new Date())}});
    });
    await mpCargar(true); cierreDia = ''; toast('Cierre revertido', 3000);
  }catch(e){ toast('No se pudo revertir', 3500); }
  finally{ cerrandoInv = false; }
  vCierre();
}

      if(cambio){ await MPREF.set({...MP, v:4}); }
      const ops = [];                                                       // 2) lista sin precios al día
      MP.items.forEach(i=>{ const w = campos(i), d = docs[i.id];
        if(!d || d.pendiente===true || ['n','g','ub','compra','cant','stock'].some(k=> JSON.stringify(d[k]===undefined?null:d[k]) !== JSON.stringify(w[k]))) ops.push(['set', i.id, {...w, pendiente:false, conteo:w.stock}]); });
      Object.keys(docs).forEach(id=>{ if(!MP.items.some(i=>i.id===id)) ops.push(['del', id]); });
      for(let k=0; k<ops.length; k+=400){ const b = db.batch(); ops.slice(k,k+400).forEach(o=> o[0]==='set' ? b.set(db.collection('equipo_inventario').doc(o[1]), o[2]) : b.delete(db.collection('equipo_inventario').doc(o[1]))); await b.commit(); }
      if(cambio && typeof pintarMP==='function' && vistaActual==='inventario') pintarMP();
    }catch(e){ console.warn('eqSync', e); }
    finally{ ocupado = false; }
  };

  /* ----- ventas que registra el equipo → ventas reales (la dueña luego hace el cierre) ----- */
  window.eqImportarVentas = async function(){
    let q; try{ q = await db.collection('ventas_equipo').where('estado','==','nuevo').get(); }catch(e){ return 0; }
    if(q.empty) return 0; let n = 0;
    for(const d of q.docs){
      const v = d.data();
      const items = (v.items||[]).map(l=>({producto:clasificar(l.pers?'Fresas Pop personalizada':l.nombre, l.tam?['Tamaño: '+l.tam]:[]), nombre:String(l.nombre||'Producto'), cantidad:Math.max(1,Math.round(Number(l.cantidad)||1)), precio:Number(l.precio)||0, crema:l.crema?(CREMA_INSUMO[l.crema]||null):null, base:l.base?(BASE_INSUMO[l.base]||null):null, complemento:null}));
      const subtotal = sum(items, l=>l.cantidad*l.precio), desc = Math.min(Math.max(Number(v.descuento)||0,0), subtotal), descs = desc>0 ? [{monto:desc, motivo:String(v.motivoDescuento||'Otro')}] : [], total = subtotal - desc;
      const pago = cuentaDe(v.pago), {cons, costo, manoObra} = consumosDe(items), hayReceta = items.some(i=>cfg.recetas[i.producto]);
      try{
        await db.collection('ventas').doc('eq_'+d.id).set({dia:v.dia, fecha:FV.serverTimestamp(), origen:'mostrador', equipo:true, por:v.por||'', items, subtotal, descuento:desc, descuentos:descs, motivoDescuento:descs.map(x=>x.motivo).join(' · '), descuentoVip:sum(descs.filter(x=>/vip/i.test(x.motivo)), x=>x.monto), propina:0, total, pago, pagos:null, costo:hayReceta?costo:null, manoObra:hayReceta?manoObra:null, consumos:cons, procesada:true});
        await d.ref.update({estado:'importado'}); n++;
      }catch(e){ console.warn('eqImportar', e); }
    }
    if(n) toast(n + (n===1 ? ' venta del equipo importada' : ' ventas del equipo importadas') + ' ✅', 3500);
    return n;
  };
  window.eqArranque = async function(){
    try{ await mpCargar(); }catch(e){}
    try{ const n = await eqImportarVentas(); if(n && ['ventas','inicio','cierre'].includes(vistaActual)) ir(vistaActual); }catch(e){}
    eqSoon(true);
    setInterval(()=>{ if(!document.hidden){ eqSync(); eqImportarVentas().then(n=>{ if(n && ['ventas','inicio','cierre'].includes(vistaActual)) ir(vistaActual); }); } }, 180000);
  };
})();
</script>
<!-- ===== PIN de 4 dígitos (se pide cada vez que se abre, y al volver tras 5 min) ===== -->
<style>
#pinLock{position:fixed; inset:0; z-index:200; background:#fff; display:none; flex-direction:column; align-items:center; justify-content:center; font-family:'Poppins',sans-serif; color:#26262a;}
#pinLock .pt{font-size:17px; font-weight:600; margin-bottom:6px;} #pinLock .ps{font-size:13px; color:#8b8b93; min-height:18px; margin-bottom:18px; text-align:center; padding:0 20px;}
#pinLock .dots{display:flex; gap:16px; margin-bottom:26px;} #pinLock .dots i{width:15px; height:15px; border-radius:50%; border:2px solid #cfcfd6; display:block;} #pinLock .dots i.on{background:#db5275; border-color:#db5275;}
#pinLock .dots.err{animation:pinsh .35s;} @keyframes pinsh{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
#pinLock .pad{display:grid; grid-template-columns:repeat(3,74px); gap:14px;} #pinLock .pad button{height:74px; border-radius:50%; border:none; background:#f3f3f5; font-size:26px; font-weight:500; color:#26262a; font-family:inherit;} #pinLock .pad button:active{background:#e4e4e8;}
#pinLock .pad button.v{background:none; font-size:20px;} #pinLock .lk{margin-top:22px; font-size:13px; color:#8b8b93; background:none; border:none; font-family:inherit; text-decoration:underline;}
.pinbtn{position:absolute; left:12px; top:14px; background:none; border:none; color:inherit; opacity:.8; font-size:12.5px; padding:4px 6px; font-family:inherit;}
</style>
<div id="pinLock"><div class="pt" id="pinT">Escribe tu PIN</div><div class="ps" id="pinS"></div><div class="dots" id="pinD"><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="pinPad"></div><button class="lk" id="pinL1" onclick="pinOlvide()">Olvidé mi PIN</button><button class="lk" id="pinL2" onclick="pinCancelar()" style="display:none;">Cancelar</button></div>
<script>
(function(){
  const REF = db.collection('finanzas_config').doc('pin'), $p = id=>document.getElementById(id);
  let modo = 'check', buf = '', primero = '', datos = null, cont = null, fallos = 0, hastaTs = 0, ocultoDesde = 0, desbloqueado = false;
  const hex = b=> Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
  async function hash(pin, salt){
    const txt = salt + ':' + pin;
    if(window.crypto && crypto.subtle){ return hex(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt))); }
    let h = 5381; for(let i=0;i<txt.length;i++) h = ((h<<5)+h+txt.charCodeAt(i))|0; return 'f' + h;
  }
  const pad = $p('pinPad'); ['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(k=>{ const b = document.createElement('button'); b.textContent = k; if(!k||k==='⌫') b.className = 'v'; if(!k) b.style.visibility = 'hidden'; else b.onclick = ()=> tecla(k); pad.appendChild(b); });
  document.addEventListener('keydown', e=>{ if($p('pinLock').style.display!=='flex') return; if(/^[0-9]$/.test(e.key)) tecla(e.key); else if(e.key==='Backspace') tecla('⌫'); });
  function pintar(){ Array.from($p('pinD').children).forEach((d,i)=> d.className = i<buf.length ? 'on' : ''); }
  function mostrar(t, s, set){ $p('pinT').textContent = t; $p('pinS').textContent = s||''; $p('pinL1').style.display = set ? 'none' : ''; $p('pinL2').style.display = set ? '' : 'none'; buf = ''; pintar(); $p('pinLock').style.display = 'flex'; }
  function error(msg){ const d = $p('pinD'); d.classList.remove('err'); void d.offsetWidth; d.classList.add('err'); $p('pinS').textContent = msg; buf = ''; setTimeout(pintar, 120); }
  async function tecla(k){
    if(k==='⌫'){ buf = buf.slice(0,-1); pintar(); return; }
    if(buf.length>=4) return; buf += k; pintar(); if(buf.length<4) return;
    if(modo==='check'){
      if(Date.now()<hastaTs){ error('Espera ' + Math.ceil((hastaTs-Date.now())/1000) + ' segundos'); return; }
      if(await hash(buf, datos.salt) === datos.hash){ fallos = 0; abrir(); }
      else { fallos++; if(fallos>=5){ hastaTs = Date.now()+30000; fallos = 0; error('Demasiados intentos. Espera 30 segundos.'); } else error('PIN incorrecto (' + fallos + ' de 5)'); }
    } else if(modo==='set1'){ primero = buf; modo = 'set2'; mostrar('Repite tu PIN', 'Escríbelo otra vez para confirmar', true); }
    else if(modo==='set2'){
      if(buf!==primero){ modo = 'set1'; primero = ''; mostrar('Elige tu PIN', 'No coincidieron. Empieza de nuevo.', true); return; }
      const salt = Math.random().toString(36).slice(2) + Date.now().toString(36);
      try{ const h = await hash(buf, salt); await REF.set({salt, hash:h, v:1, cambiado:new Date().toISOString()}); datos = {salt, hash:h}; $p('pinLock').style.display = 'none'; modo = 'check'; alert('PIN guardado. Se pedirá cada vez que abras la app.'); }
      catch(e){ mostrar('Elige tu PIN', 'No se pudo guardar. Intenta de nuevo.', true); modo = 'set1'; }
    }
  }
  function abrir(){ $p('pinLock').style.display = 'none'; desbloqueado = true; if(cont){ const c = cont; cont = null; c(); } }
  window.pinGate = async function(user, continuar){
    if(window.__loginFresco){ continuar(); return; }          // acaba de entrar con su contraseña
    cont = continuar;
    try{ const s = await REF.get(); if(!s.exists){ continuar(); cont = null; return; } datos = s.data(); modo = 'check'; mostrar('Escribe tu PIN', 'Fresas Pop'); }
    catch(e){ modo = 'check'; mostrar('No se pudo verificar', 'Revisa tu internet y recarga la página.'); }
  };
  window.pinConfigurar = ()=>{ modo = 'set1'; primero = ''; mostrar('Elige tu PIN', 'Son 4 números. Lo pedirá la app cada vez que la abras.', true); };
  window.pinQuitar = async ()=>{ if(!confirm('¿Quitar el PIN? La app dejará de pedirlo.')) return; try{ await REF.delete(); datos = null; alert('PIN quitado.'); }catch(e){ alert('No se pudo quitar.'); } };
  window.pinCancelar = ()=>{ $p('pinLock').style.display = 'none'; modo = 'check'; };
  window.pinOlvide = ()=>{ if(confirm('Para entrar sin PIN tendrás que iniciar sesión con tu correo y contraseña. Allí podrás crear un PIN nuevo. ¿Continuar?')) auth.signOut().then(()=>location.reload()); };
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){ ocultoDesde = Date.now(); return; }
    if(desbloqueado && datos && ocultoDesde && Date.now()-ocultoDesde > 5*60*1000 && $p('pinLock').style.display!=='flex'){ modo = 'check'; mostrar('Escribe tu PIN', 'Por seguridad, vuelve a ingresarlo'); }
  });
})();
</script>
