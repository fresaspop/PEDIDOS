<!DOCTYPE html>
<html lang="es-DO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Fresas Pop | Panel de administrador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<style>
:root{
  --principal:#db5275;
  --vino:#56091f;
  --rojo:#b62d11;
  --crema:#fff3f4;
  --blanco:#ffffff;
  --texto:#3a1420;
  --gris:#8a7378;
  --verde:#2e9e5b;
  --sombra: 0 6px 18px rgba(86,9,31,.10);
  --radius: 16px;
}
*{box-sizing:border-box;}
body{
  font-family:'Poppins',sans-serif; background:var(--crema); color:var(--texto);
  margin:0; padding:0 0 60px;
}
h1,h2,h3,.brand{font-family:'Baloo 2',sans-serif;}
header{
  background:var(--vino); color:#fff; padding:18px 20px; text-align:center;
  position:sticky; top:0; z-index:10;
}
header h1{margin:0; font-size:19px;}
header p{margin:2px 0 0; font-size:12px; opacity:.85;}
.wrap{max-width:640px; margin:0 auto; padding:16px;}

/* login */
#loginBox{max-width:340px; margin:60px auto; padding:24px; background:#fff; border-radius:var(--radius); box-shadow:var(--sombra); text-align:center;}
#loginBox input{width:100%; padding:12px; border-radius:12px; border:1.5px solid #eed3d8; font-size:15px; margin:14px 0;}
#loginBox button{width:100%; padding:12px; border:none; border-radius:12px; background:var(--principal); color:#fff; font-weight:700; font-size:15px;}
#loginError{color:var(--rojo); font-size:13px; min-height:18px;}

/* tabs */
.tabs{display:flex; gap:8px; overflow-x:auto; padding:14px 16px 0; }
.tab-btn{flex:none; padding:9px 14px; border-radius:20px; border:1.5px solid var(--principal); background:#fff; color:var(--principal); font-weight:600; font-size:13px; white-space:nowrap;}
.tab-btn.active{background:var(--principal); color:#fff;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

.card{background:#fff; border-radius:var(--radius); box-shadow:var(--sombra); padding:14px 16px; margin-bottom:12px;}
.card-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.item-name{font-weight:600; font-size:14.5px;}
.item-sub{font-size:12px; color:var(--gris); margin-top:2px;}

.switch{position:relative; width:46px; height:26px; flex:none;}
.switch input{opacity:0; width:0; height:0;}
.slider{position:absolute; cursor:pointer; inset:0; background:#e3c3c9; border-radius:26px; transition:.2s;}
.slider:before{content:""; position:absolute; height:20px; width:20px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.2s;}
input:checked + .slider{background:var(--verde);}
input:checked + .slider:before{transform:translateX(20px);}

.section-title{font-size:15px; font-weight:700; margin:18px 0 8px; color:var(--vino);}
.small-btn{padding:6px 12px; border-radius:10px; border:none; font-size:12px; font-weight:600; cursor:pointer;}
.btn-edit{background:#f0e2e4; color:var(--vino);}
.btn-del{background:#fbdede; color:var(--rojo);}
.btn-add{background:var(--principal); color:#fff; width:100%; padding:12px; border:none; border-radius:12px; font-weight:700; font-size:14px; margin-top:6px;}

.field{margin-bottom:10px;}
.field label{display:block; font-size:12.5px; font-weight:600; margin-bottom:4px; color:var(--vino);}
.field input, .field select, .field textarea{width:100%; padding:10px; border-radius:10px; border:1.5px solid #eed3d8; font-size:14px; font-family:inherit;}

.overlay{position:fixed; inset:0; background:rgba(58,20,32,.5); display:none; align-items:flex-end; justify-content:center; z-index:50;}
.overlay.active{display:flex;}
.modal{background:#fff; width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:20px; max-height:88vh; overflow-y:auto;}
.modal h3{margin-top:0;}
.modal-actions{display:flex; gap:10px; margin-top:14px;}
.modal-actions button{flex:1; padding:12px; border:none; border-radius:12px; font-weight:700; font-size:14px;}
.btn-cancel{background:#f0e2e4; color:var(--vino);}
.btn-save{background:var(--principal); color:#fff;}

.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--vino); color:#fff; padding:10px 18px; border-radius:30px; font-size:13px; opacity:0; transition:.25s; pointer-events:none; z-index:100;}
.toast.show{opacity:1;}
.oferta-card{border-left:4px solid var(--principal);}
.empty-note{text-align:center; color:var(--gris); font-size:13px; padding:20px 0;}
.logout-btn{background:none; border:1.5px solid rgba(255,255,255,.6); color:#fff; font-size:12px; padding:5px 12px; border-radius:20px; position:absolute; right:14px; top:18px;}
</style>
</head>
<body>

<div id="loginBox">
  <h2 class="brand">🍓 Fresas Pop</h2>
  <p style="color:var(--gris); font-size:13px;">Panel de administrador</p>
  <input type="password" id="passInput" placeholder="Contraseña">
  <button onclick="intentarLogin()">Entrar</button>
  <div id="loginError"></div>
</div>

<div id="adminApp" style="display:none;">
  <header>
    <button class="logout-btn" onclick="cerrarSesion()">Salir</button>
    <h1 class="brand">Panel de administrador</h1>
    <p>Fresas Pop</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="disponibilidad">Disponibilidad</button>
    <button class="tab-btn" data-tab="productos">Productos</button>
    <button class="tab-btn" data-tab="ingredientes">Ingredientes</button>
    <button class="tab-btn" data-tab="ofertas">Ofertas</button>
  </div>

  <div class="wrap">

    <!-- DISPONIBILIDAD -->
    <div class="tab-panel active" id="panel-disponibilidad">
      <p class="empty-note" style="padding:6px 0 14px;">Activa o desactiva lo que esté agotado. Los cambios se ven al instante en el sitio.</p>
      <div id="dispContainer"></div>
    </div>

    <!-- PRODUCTOS -->
    <div class="tab-panel" id="panel-productos">
      <div id="prodContainer"></div>
    </div>

    <!-- INGREDIENTES -->
    <div class="tab-panel" id="panel-ingredientes">
      <div id="ingContainer"></div>
    </div>

    <!-- OFERTAS -->
    <div class="tab-panel" id="panel-ofertas">
      <div id="ofertasContainer"></div>
      <button class="btn-add" onclick="abrirModalOferta()">+ Crear nueva oferta</button>
    </div>

  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalContent"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDr190z0obWeyDmm2UY6_5rZ_PqXUr883E",
  authDomain: "adminfresaspop.firebaseapp.com",
  projectId: "adminfresaspop",
  storageBucket: "adminfresaspop.firebasestorage.app",
  messagingSenderId: "840834985196",
  appId: "1:840834985196:web:28f8fa890ace7ac3dc89c9"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const MENU_DOC = db.collection('menu_data').doc('main');
const OFERTAS_COL = db.collection('ofertas');

const ADMIN_PASSWORD = "pf321NIMDA";

let menu = null; // documento completo cargado desde Firestore

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 1800);
}

/* ---------- LOGIN ---------- */
function intentarLogin(){
  const val = document.getElementById('passInput').value;
  if(val === ADMIN_PASSWORD){
    sessionStorage.setItem('fp_admin_ok','1');
    document.getElementById('loginBox').style.display='none';
    document.getElementById('adminApp').style.display='block';
    cargarMenu();
  } else {
    document.getElementById('loginError').textContent = 'Contraseña incorrecta';
  }
}
function cerrarSesion(){
  sessionStorage.removeItem('fp_admin_ok');
  location.reload();
}
document.getElementById('passInput').addEventListener('keydown', e=>{ if(e.key==='Enter') intentarLogin(); });
if(sessionStorage.getItem('fp_admin_ok')==='1'){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('adminApp').style.display='block';
  cargarMenu();
}

/* ---------- TABS ---------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
  });
});

/* ---------- CARGA / GUARDADO ---------- */
async function cargarMenu(){
  const snap = await MENU_DOC.get();
  menu = snap.exists ? snap.data() : {tamanos:[],bases:[],cremas:[],frutas:[],toppings:[],extras:[],favoritas:[],premium:[],otros:[]};
  ['tamanos','bases','cremas','frutas','toppings','extras','favoritas','premium','otros'].forEach(k=>{ if(!menu[k]) menu[k]=[]; });
  renderTodo();
  cargarOfertas();
}
async function guardarMenu(){
  await MENU_DOC.set(menu);
}

const CATS = [
  {key:'bases', label:'Bases'},
  {key:'cremas', label:'Cremas'},
  {key:'frutas', label:'Frutas'},
  {key:'toppings', label:'Toppings'},
  {key:'extras', label:'Extras'},
  {key:'tamanos', label:'Tamaños'},
];
const PROD_CATS = [
  {key:'favoritas', label:'Favoritas'},
  {key:'premium', label:'Premium'},
  {key:'otros', label:'Otros postres'},
];

function renderTodo(){
  renderDisponibilidad();
  renderProductos();
  renderIngredientes();
}

/* ---------- DISPONIBILIDAD (todo en una vista) ---------- */
function renderDisponibilidad(){
  const cont = document.getElementById('dispContainer');
  cont.innerHTML = '';
  const grupos = [...PROD_CATS, ...CATS];
  grupos.forEach(g=>{
    const items = menu[g.key] || [];
    if(!items.length) return;
    const title = document.createElement('div');
    title.className = 'section-title';
    title.textContent = g.label;
    cont.appendChild(title);
    items.forEach(item=>{
      const card = document.createElement('div');
      card.className = 'card card-row';
      const nombre = item.nombre || item.label;
      card.innerHTML = `
        <div>
          <div class="item-name">${nombre}</div>
          <div class="item-sub">${g.label}</div>
        </div>
        <label class="switch">
          <input type="checkbox" ${item.disponible!==false?'checked':''}>
          <span class="slider"></span>
        </label>`;
      card.querySelector('input').addEventListener('change', async (e)=>{
        item.disponible = e.target.checked;
        await guardarMenu();
        showToast(e.target.checked ? `${nombre} disponible` : `${nombre} marcado agotado`);
      });
      cont.appendChild(card);
    });
  });
}

/* ---------- PRODUCTOS (favoritas / premium / otros) ---------- */
function renderProductos(){
  const cont = document.getElementById('prodContainer');
  cont.innerHTML = '';
  PROD_CATS.forEach(cat=>{
    const title = document.createElement('div');
    title.className = 'section-title';
    title.textContent = cat.label;
    cont.appendChild(title);
    (menu[cat.key]||[]).forEach((item, idx)=>{
      const precio = item.price!=null ? `RD$${item.price}` : (item.sizes||[]).map(s=>`${s.label}: RD$${s.price}`).join(' · ');
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-row">
          <div>
            <div class="item-name">${item.nombre}</div>
            <div class="item-sub">${precio}</div>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="small-btn btn-edit">Editar</button>
            <button class="small-btn btn-del">Eliminar</button>
          </div>
        </div>`;
      card.querySelector('.btn-edit').addEventListener('click', ()=> abrirModalProducto(cat.key, idx));
      card.querySelector('.btn-del').addEventListener('click', async ()=>{
        if(confirm(`¿Eliminar "${item.nombre}"?`)){
          menu[cat.key].splice(idx,1);
          await guardarMenu();
          renderTodo();
          showToast('Producto eliminado');
        }
      });
      cont.appendChild(card);
    });
    const addBtn = document.createElement('button');
    addBtn.className = 'btn-add';
    addBtn.textContent = `+ Agregar a ${cat.label}`;
    addBtn.addEventListener('click', ()=> abrirModalProducto(cat.key, null));
    cont.appendChild(addBtn);
  });
}

function abrirModalProducto(catKey, idx){
  const esNuevo = idx===null;
  const item = esNuevo ? {nombre:'', desc:'', price: catKey==='otros'?0:undefined, sizes: catKey!=='otros'?[{id:'unico',label:'Único',price:0}]:undefined, disponible:true} : menu[catKey][idx];
  const usaTamanos = catKey!=='otros';
  const modal = document.getElementById('modalContent');
  modal.innerHTML = `
    <h3>${esNuevo?'Agregar producto':'Editar producto'}</h3>
    <div class="field"><label>Nombre</label><input id="f_nombre" value="${item.nombre||''}"></div>
    <div class="field"><label>Descripción</label><textarea id="f_desc" rows="2">${item.desc||''}</textarea></div>
    ${usaTamanos ? `
      <div class="field"><label>Precio 12 oz (RD$)</label><input id="f_p12" type="number" value="${(item.sizes||[]).find(s=>s.id==='12oz')?.price ?? ''}"></div>
      <div class="field"><label>Precio 9 oz (RD$, opcional)</label><input id="f_p9" type="number" value="${(item.sizes||[]).find(s=>s.id==='9oz')?.price ?? ''}"></div>
    ` : `
      <div class="field"><label>Precio (RD$)</label><input id="f_price" type="number" value="${item.price ?? ''}"></div>
    `}
    <div class="modal-actions">
      <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-save" onclick="guardarProducto('${catKey}', ${esNuevo?'null':idx})">Guardar</button>
    </div>`;
  document.getElementById('overlay').classList.add('active');
}

async function guardarProducto(catKey, idx){
  const nombre = document.getElementById('f_nombre').value.trim();
  const desc = document.getElementById('f_desc').value.trim();
  if(!nombre){ showToast('Falta el nombre'); return; }
  let nuevo;
  if(catKey==='otros'){
    const price = Number(document.getElementById('f_price').value)||0;
    nuevo = {id: idx!==null ? menu[catKey][idx].id : 'p_'+Date.now(), nombre, desc, price, img:null, disponible:true};
  } else {
    const p12 = document.getElementById('f_p12').value;
    const p9 = document.getElementById('f_p9').value;
    const sizes = [];
    if(p12!=='') sizes.push({id:'12oz', label:'12 oz', price:Number(p12)});
    if(p9!=='') sizes.push({id:'9oz', label:'9 oz', price:Number(p9)});
    if(!sizes.length){ showToast('Agrega al menos un precio'); return; }
    nuevo = {id: idx!==null ? menu[catKey][idx].id : 'p_'+Date.now(), nombre, desc, sizes, img:null,
      toppingDefault: menu[catKey][idx]?.toppingDefault, cortesia: menu[catKey][idx]?.cortesia||false, disponible:true};
    if(idx!==null) nuevo.disponible = menu[catKey][idx].disponible!==false;
  }
  if(idx!==null){ menu[catKey][idx] = {...menu[catKey][idx], ...nuevo}; } else { menu[catKey].push(nuevo); }
  await guardarMenu();
  cerrarModal();
  renderTodo();
  showToast('Guardado');
}

/* ---------- INGREDIENTES (bases, cremas, frutas, toppings, extras) ---------- */
function renderIngredientes(){
  const cont = document.getElementById('ingContainer');
  cont.innerHTML = '';
  CATS.filter(c=>c.key!=='tamanos').forEach(cat=>{
    const title = document.createElement('div');
    title.className = 'section-title';
    title.textContent = cat.label;
    cont.appendChild(title);
    (menu[cat.key]||[]).forEach((item, idx)=>{
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-row">
          <div>
            <div class="item-name">${item.label}</div>
            <div class="item-sub">${item.extra ? 'Costo extra: RD$'+item.extra : 'Sin costo extra'}</div>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="small-btn btn-edit">Editar</button>
            <button class="small-btn btn-del">Eliminar</button>
          </div>
        </div>`;
      card.querySelector('.btn-edit').addEventListener('click', ()=> abrirModalIngrediente(cat.key, idx));
      card.querySelector('.btn-del').addEventListener('click', async ()=>{
        if(confirm(`¿Eliminar "${item.label}"?`)){
          menu[cat.key].splice(idx,1);
          await guardarMenu();
          renderTodo();
          showToast('Eliminado');
        }
      });
      cont.appendChild(card);
    });
    const addBtn = document.createElement('button');
    addBtn.className = 'btn-add';
    addBtn.textContent = `+ Agregar ${cat.label.slice(0,-1)}`;
    addBtn.addEventListener('click', ()=> abrirModalIngrediente(cat.key, null));
    cont.appendChild(addBtn);
  });
}

function abrirModalIngrediente(catKey, idx){
  const esNuevo = idx===null;
  const item = esNuevo ? {label:'', extra:0} : menu[catKey][idx];
  const modal = document.getElementById('modalContent');
  modal.innerHTML = `
    <h3>${esNuevo?'Agregar':'Editar'} — ${CATS.find(c=>c.key===catKey).label}</h3>
    <div class="field"><label>Nombre</label><input id="f_label" value="${item.label||''}"></div>
    <div class="field"><label>Costo extra (RD$, 0 si no tiene costo)</label><input id="f_extra" type="number" value="${item.extra||0}"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-save" onclick="guardarIngrediente('${catKey}', ${esNuevo?'null':idx})">Guardar</button>
    </div>`;
  document.getElementById('overlay').classList.add('active');
}

async function guardarIngrediente(catKey, idx){
  const label = document.getElementById('f_label').value.trim();
  const extra = Number(document.getElementById('f_extra').value)||0;
  if(!label){ showToast('Falta el nombre'); return; }
  if(idx!==null){
    menu[catKey][idx].label = label;
    menu[catKey][idx].extra = extra;
  } else {
    menu[catKey].push({id:'i_'+Date.now(), label, extra, disponible:true});
  }
  await guardarMenu();
  cerrarModal();
  renderTodo();
  showToast('Guardado');
}

function cerrarModal(){
  document.getElementById('overlay').classList.remove('active');
}
document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') cerrarModal(); });

/* ---------- OFERTAS ---------- */
async function cargarOfertas(){
  const cont = document.getElementById('ofertasContainer');
  cont.innerHTML = '<p class="empty-note">Cargando...</p>';
  const snap = await OFERTAS_COL.orderBy('creada','desc').get().catch(()=>OFERTAS_COL.get());
  if(snap.empty){
    cont.innerHTML = '<p class="empty-note">No hay ofertas creadas todavía.</p>';
    return;
  }
  cont.innerHTML = '';
  snap.forEach(doc=>{
    const o = doc.data();
    const card = document.createElement('div');
    card.className = 'card oferta-card';
    card.innerHTML = `
      <div class="card-row">
        <div style="flex:1;">
          <div class="item-name">${o.texto}</div>
        </div>
        <label class="switch">
          <input type="checkbox" ${o.activa?'checked':''}>
          <span class="slider"></span>
        </label>
      </div>
      <div style="margin-top:8px; display:flex; justify-content:flex-end;">
        <button class="small-btn btn-del">Eliminar</button>
      </div>`;
    card.querySelector('input').addEventListener('change', async e=>{
      await OFERTAS_COL.doc(doc.id).update({activa: e.target.checked});
      showToast(e.target.checked ? 'Oferta activada' : 'Oferta desactivada');
    });
    card.querySelector('.btn-del').addEventListener('click', async ()=>{
      if(confirm('¿Eliminar esta oferta?')){
        await OFERTAS_COL.doc(doc.id).delete();
        cargarOfertas();
        showToast('Oferta eliminada');
      }
    });
    cont.appendChild(card);
  });
}

function abrirModalOferta(){
  const modal = document.getElementById('modalContent');
  modal.innerHTML = `
    <h3>Nueva oferta</h3>
    <div class="field"><label>Texto que verán tus clientes</label>
      <textarea id="f_oferta_texto" rows="2" placeholder="Ej: 20% OFF en Fresas Dubái este fin de semana"></textarea>
    </div>
    <p class="item-sub" style="margin:-4px 0 10px;">Nota: esto muestra un aviso en el sitio. Si el descuento cambia un precio, recuerda también editarlo en la pestaña "Productos" o "Ingredientes".</p>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-save" onclick="guardarOferta()">Crear y activar</button>
    </div>`;
  document.getElementById('overlay').classList.add('active');
}

async function guardarOferta(){
  const texto = document.getElementById('f_oferta_texto').value.trim();
  if(!texto){ showToast('Escribe el texto de la oferta'); return; }
  await OFERTAS_COL.add({texto, activa:true, creada: firebase.firestore.FieldValue.serverTimestamp()});
  cerrarModal();
  cargarOfertas();
  showToast('Oferta creada');
}
</script>
</body>
</html>
