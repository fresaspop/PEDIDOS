header h1{margin:0; font-size:15px; font-weight:600;} header .q{font-size:12px; color:var(--g);} header button{border:none; background:none; color:var(--g); font:inherit; font-size:12.5px;}
.tabs{display:flex; border-bottom:1px solid var(--l); position:sticky; top:46px; background:#fff; z-index:19;} .tabs button{flex:1; padding:11px 0; border:none; background:none; font:600 13.5px 'Poppins',sans-serif; color:var(--g); border-bottom:2.5px solid transparent;} .tabs button.on{color:var(--p); border-bottom-color:var(--p);}
main{padding:12px 14px; max-width:560px; margin:0 auto;}
#login{max-width:340px; margin:14vh auto 0; padding:0 22px; text-align:center;} #login h2{font-weight:600; font-size:20px; margin:0 0 4px;} #login p{color:var(--g); font-size:13px; margin:0 0 16px;}
input,select{width:100%; padding:11px 12px; border:1px solid #dcdce2; border-radius:10px; font:inherit; font-size:14px; background:#fff; margin-bottom:8px; color:var(--t);}
.btn{width:100%; padding:12px; border:none; border-radius:12px; background:var(--p); color:#fff; font:600 14px 'Poppins',sans-serif;} .btn.sec{background:#f3f3f5; color:var(--t);} .btn.red{background:#fdecec; color:var(--rojo);} .btn:disabled{opacity:.55;}
.err{color:var(--rojo); font-size:12.5px; min-height:18px; margin-bottom:6px;} .sub{font-size:12px; color:var(--g);} .empty{text-align:center; color:var(--g); padding:26px 10px;}
.chips{display:flex; gap:6px; overflow-x:auto; margin-bottom:10px; padding-bottom:2px;} .chip{flex:none; padding:6px 12px; border-radius:999px; background:#f3f3f5; font-size:12.5px; font-weight:500;} .chip.on{background:var(--p); color:#fff;}
.mv{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; padding:11px 2px; border-bottom:1px solid var(--l);} .mv b{font-weight:600;} .out{color:var(--rojo);} .ok{color:var(--ok);}
.alerta{background:#fff4e5; border:1px solid #f5d9a8; color:#7a4b00; border-radius:10px; padding:9px 11px; font-size:12.5px; margin-bottom:10px;}
.acts{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;} .acts.u{grid-template-columns:1fr;}
.field label{display:block; font-size:12px; color:var(--g); margin:0 0 3px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
details.grp{border:1px solid var(--l); border-radius:12px; margin-bottom:8px; background:#fff;} details.grp summary{padding:11px 12px; font-weight:600; font-size:13.5px; cursor:pointer; list-style:none;} details.grp summary::-webkit-details-marker{display:none;}
.vs-row{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 12px; border-top:1px solid var(--l);} .vs-n{font-size:13px; font-weight:500; flex:1;} .vs-p{font-size:11.5px; color:var(--g);}
.stp{display:flex; align-items:center; gap:6px;} .stp button{width:30px; height:30px; border-radius:50%; border:none; background:#f3f3f5; font-size:17px; font-weight:600;} .stp button.m{background:var(--p); color:#fff;} .stp span{min-width:20px; text-align:center; font-weight:600;}
.bar{position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--l); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); display:none; align-items:center; justify-content:space-between; z-index:25;} .bar button{border:none; border-radius:999px; background:var(--p); color:#fff; padding:10px 18px; font:600 13.5px 'Poppins',sans-serif;}
.ov{position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:flex-end; justify-content:center; z-index:60;} .ov .sh{background:#fff; border-radius:18px 18px 0 0; width:100%; max-width:560px; max-height:88vh; overflow:auto; padding:18px 16px 24px;} .sh h3{margin:0 0 10px; font-size:16px;}
.toast{position:fixed; left:50%; bottom:80px; transform:translateX(-50%); background:#26262a; color:#fff; padding:9px 16px; border-radius:999px; font-size:13px; z-index:90; display:none;}
.rowt{display:flex; justify-content:space-between; padding:3px 0;} .tot{font-weight:700; font-size:15px;}
</style>
</head>
<body>

<div id="login">
  <h2>Fresas Pop · Equipo</h2><p>Entra con tu correo y contraseña</p>
  <input type="email" id="lE" placeholder="Correo" autocomplete="username">
  <input type="password" id="lP" placeholder="Contraseña" autocomplete="current-password">
  <div class="err" id="lErr"></div><button class="btn" onclick="entrar()">Entrar</button>
</div>

<div id="app" style="display:none;">
  <header><h1>Fresas Pop · Equipo</h1><div><span class="q" id="quien"></span> <button onclick="salir()">Salir</button></div></header>
  <div class="tabs" id="tabs"></div>
  <main id="vista"></main>
</div>
<div class="bar" id="bar"><span id="barT"></span><button onclick="document.getElementById('vFin').scrollIntoView({behavior:'smooth'})">Terminar ↓</button></div>
<div class="ov" id="ov" onclick="if(event.target===this)cerrar()"><div class="sh" id="sh"></div></div>
<div class="toast" id="toast"></div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyDr190z0obWeyDmm2UY6_5rZ_PqXUr883E", authDomain: "adminfresaspop.firebaseapp.com", projectId: "adminfresaspop",
  storageBucket: "adminfresaspop.firebasestorage.app", messagingSenderId: "840834985196", appId: "1:840834985196:web:28f8fa890ace7ac3dc89c9"
});
const db = firebase.firestore(), auth = firebase.auth(), FV = firebase.firestore.FieldValue;
const $ = s=>document.querySelector(s);
const esc = t=> String(t==null?'':t).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v=> Number(String(v).replace(/[^\d.\-]/g,''))||0;
const money = n=>{ const v = Math.round((Number(n)||0)*100)/100; return 'RD$' + Math.abs(v).toLocaleString('es-DO',{minimumFractionDigits:0, maximumFractionDigits:2}); };
const fnum = x=> (x==null || isNaN(x)) ? '—' : (Math.round(x*100)/100).toLocaleString('es-DO');
const r2c = x=> Math.round(x*100)/100, r3b = x=> Math.round(x*1000)/1000;
const iso = d=> d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const sinAc = t=> String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
let toastT; function toast(m, ms){ const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(()=>t.style.display = 'none', ms||2200); }
function abrir(h){ $('#sh').innerHTML = h; $('#ov').style.display = 'flex'; } function cerrar(){ $('#ov').style.display = 'none'; }

/* ---------- sesión ---------- */
$('#lE').value = localStorage.getItem('fp_equipo_email') || '';
function entrar(){ const e = $('#lE').value.trim(), p = $('#lP').value; $('#lErr').textContent = ''; auth.signInWithEmailAndPassword(e,p).then(()=>localStorage.setItem('fp_equipo_email', e)).catch(()=> $('#lErr').textContent = 'Correo o contraseña incorrectos.'); }
function salir(){ auth.signOut().then(()=>location.reload()); }
$('#lP').addEventListener('keydown', e=>{ if(e.key==='Enter') entrar(); });
let YO = null, PERM = [], tab = '';
auth.onAuthStateChanged(async u=>{
  if(!u) return;
  $('#login').style.display = 'none'; $('#app').style.display = 'block';
  const correo = (u.email||'').toLowerCase(); $('#vista').innerHTML = '<div class="empty">Cargando…</div>';
  try{
    const s = await db.collection('equipo').doc(correo).get();
    if(!s.exists || !s.data().activo || !(s.data().permisos||[]).length){ $('#tabs').innerHTML = ''; $('#vista').innerHTML = '<div class="empty">Tu cuenta todavía no tiene acceso.<br>Pídele a la dueña que te active.<br><br><button class="btn sec" onclick="salir()">Salir</button></div>'; return; }
    YO = {correo, ...s.data()}; PERM = YO.permisos; $('#quien').textContent = YO.nombre || correo;
    const T = [['inventario','Inventario'],['ventas','Ventas del día']].filter(x=>PERM.includes(x[0]));
    $('#tabs').innerHTML = T.map(([k,l])=>`<button id="tb_${k}" onclick="ir('${k}')">${l}</button>`).join(''); ir(T[0][0]);
  }catch(e){ $('#vista').innerHTML = '<div class="empty">No se pudo entrar. Revisa tu internet.<br><br><button class="btn sec" onclick="salir()">Salir</button></div>'; }
});
function ir(k){ tab = k; document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b.id==='tb_'+k)); $('#bar').style.display = 'none'; k==='inventario' ? vInv() : vVentas(); }

/* =====================  INVENTARIO  ===================== */
const GRUPOS = {A:'Materia prima', B:'Empaques', C:'Limpieza', D:'Otros'};
let INV = [], gTab = 'A', q = '';
function cuMP(i){ let w = String(i.compra||'').trim().toLowerCase().replace(/\(.*$/,'').replace(/\s+de\s.*$/,'').replace(/\s*\d.*$/,'').trim(); const f = Number(i.cant); if(!w || w==='unidad' || !(f>0)) return {u:i.ub, f:1, w:false}; return {u:w, f, w:true}; }
function plMP(u,n){ if(Math.abs(n-1)<1e-9 || /^medio /.test(u)) return u; if(/ón$/.test(u)) return u.slice(0,-2)+'ones'; if(/[aeio]$/.test(u)) return u+'s'; if(/d$/.test(u)) return u+'es'; return u; }
const FRAC = [[0.25,'¼'],[0.5,'½'],[0.75,'¾']];
function partes(i, v){ const c = cuMP(i); if(!c.w || c.f<=1) return {n:null, rem:v, c}; const n = Math.floor(v/c.f + 1e-9); return {n, rem:r3b(v - n*c.f), c}; }
const valor = i=> i.pendiente===true ? i.conteo : i.stock;
function stockTxt(i, v){
  const c = cuMP(i); if(!c.w) return fnum(r2c(v)) + ' ' + i.ub;
  const P = partes(i, v), n = P.n, rem = P.rem, hay = rem > 0.0005, fr = hay ? FRAC.find(x=>Math.abs(rem/c.f - x[0]) < 0.03) : null;
  if(n===null){ const x = r2c(v/c.f); return fnum(x) + ' ' + plMP(c.u, x); }
  const resto = !hay ? '' : (i.ub==='unidad' ? fnum(r2c(rem)) + (rem===1?' suelto':' sueltos') : (fr ? fr[1] : fnum(r2c(rem)) + ' ' + i.ub));
  if(n===0) return hay ? ((i.ub==='unidad' || !fr) ? resto : resto + ' de ' + c.u) : '0 ' + plMP(c.u,0);
  return fnum(n) + ' ' + plMP(c.u, n) + (hay ? ' y ' + resto : '');
}
function campos(i, p){
  const c = cuMP(i), v = valor(i), sb = v==null ? null : partes(i, v);
  if(!c.w) return `<div class="field"><label>Cuántos ${esc(i.ub)} hay</label><input id="${p}1" inputmode="decimal" value="${v==null?'':r2c(v)}" data-o="${v==null?'':r2c(v)}" placeholder="0"></div>`;
  const v1 = sb ? (sb.n===null ? r2c(v/c.f) : sb.n) : '', v2 = sb && sb.n!==null ? r2c(sb.rem) : '', suelto = i.ub==='unidad';
  return `<div class="grid2"><div class="field"><label>${esc(plMP(c.u,2))} cerrados</label><input id="${p}1" inputmode="decimal" value="${v1}" data-o="${v1}" placeholder="0"></div>
    <div class="field"><label>${suelto?'Sueltos (unidades)':'Abierto / sobrante ('+esc(i.ub)+')'}</label><input id="${p}2" inputmode="decimal" value="${v2}" data-o="${v2}" placeholder="0"></div></div>
    ${suelto || c.f<=1 ? '' : `<div class="chips">${FRAC.map(x=>`<div class="chip" onclick="document.getElementById('${p}2').value='${r2c(c.f*x[0])}'">${x[1]} ${esc(c.u)}</div>`).join('')}</div>`}`;
}
function leer(i, p){
  const c = cuMP(i), e1 = $('#'+p+'1'), e2 = $('#'+p+'2'), t1 = e1.value.trim(), t2 = e2 ? e2.value.trim() : '';
  if(t1==='' && t2==='') return null;
  if(t1===e1.dataset.o && (!e2 || t2===e2.dataset.o) && valor(i)!=null) return valor(i);
  const a = t1==='' ? 0 : num(t1), b = t2==='' ? 0 : num(t2);
  return c.w ? r3b(a*c.f + b) : r3b(a);
}
async function vInv(){
  if(!INV.length){ $('#vista').innerHTML = '<div class="empty">Cargando…</div>'; try{ const s = await db.collection('equipo_inventario').get(); INV = s.docs.map(d=>({id:d.id, ...d.data()})); }catch(e){ $('#vista').innerHTML = '<div class="empty">No se pudo cargar el inventario.</div>'; return; } }
  const L = INV.filter(i=>i.g===gTab && (!q || sinAc(i.n).includes(sinAc(q)))).sort((a,b)=>a.n.localeCompare(b.n,'es'));
  $('#vista').innerHTML = `<div class="chips">${Object.keys(GRUPOS).map(k=>`<div class="chip ${gTab===k?'on':''}" onclick="gTab='${k}'; vInv()">${GRUPOS[k]}</div>`).join('')}</div>
    <input type="search" placeholder="Buscar…" value="${esc(q)}" onchange="q=this.value; vInv()">
    ${L.length ? L.map(i=>{ const v = valor(i); return `<div class="mv" onclick="abrirItem('${i.id}')"><div><b>${esc(i.n)}</b>${i.pendiente?'<div class="sub ok">Anotado ✓</div>':''}</div><div style="text-align:right;"><b>${v==null?'<span class="sub">sin contar</span>':esc(stockTxt(i,v))}</b></div></div>`; }).join('') : '<div class="empty">Nada aquí.</div>'}
    <div class="acts u"><button class="btn" onclick="rapido()">Conteo rápido de ${GRUPOS[gTab]}</button></div>`;
}
function abrirItem(id){
  const i = INV.find(x=>x.id===id), c = cuMP(i);
  abrir(`<h3>${esc(i.n)}</h3>${campos(i,'ci')}${c.w?`<div class="sub" style="margin-bottom:8px;">1 ${esc(c.u)} = ${fnum(c.f)} ${esc(i.ub)}. Cuenta los cerrados y lo que sobra suelto o abierto.</div>`:''}
    <div class="acts"><button class="btn sec" onclick="cerrar()">Cancelar</button><button class="btn" onclick="guardarItem('${id}')">Guardar</button></div>`);
}
async function anotar(i, nuevo){
  await db.collection('equipo_inventario').doc(i.id).update({conteo:nuevo, conteoPor:YO.correo, conteoTs:FV.serverTimestamp(), pendiente:true});
  i.conteo = nuevo; i.pendiente = true;
}
async function guardarItem(id){
  const i = INV.find(x=>x.id===id), nv = leer(i, 'ci'); if(nv===null){ toast('Escribe cuánto hay'); return; }
  try{ await anotar(i, nv); cerrar(); toast('Guardado ✅'); vInv(); }catch(e){ toast('No se pudo guardar. Intenta otra vez.', 3000); }
}
let RL = [], RI = 0;
function rapido(){ RL = INV.filter(i=>i.g===gTab).sort((a,b)=>a.n.localeCompare(b.n,'es')).map(i=>i.id); RI = 0; if(!RL.length){ toast('No hay artículos'); return; } rapPintar(); }
function rapPintar(){
  if(RI >= RL.length){ cerrar(); toast('Conteo terminado ✅'); vInv(); return; }
  const i = INV.find(x=>x.id===RL[RI]), v = valor(i);
  abrir(`<div class="sub">${GRUPOS[gTab]} · ${RI+1} de ${RL.length}</div><h3 style="margin-top:2px;">${esc(i.n)}</h3>
    <div class="alerta">Dice que hay: <b>${v==null?'sin contar':esc(stockTxt(i,v))}</b></div>${campos(i,'ci')}
    <div class="acts"><button class="btn sec" onclick="RI++; rapPintar()">Saltar</button><button class="btn sec" onclick="RI++; rapPintar()">Está bien</button></div>
    <div class="acts"><button class="btn sec" onclick="cerrar(); vInv()">Terminar</button><button class="btn" onclick="rapGuardar()">Guardar y seguir</button></div>`);
}
async function rapGuardar(){ const i = INV.find(x=>x.id===RL[RI]), nv = leer(i,'ci'); if(nv!==null && nv!==valor(i)){ try{ await anotar(i, nv); }catch(e){ toast('No se pudo guardar', 3000); return; } } RI++; rapPintar(); }

/* =====================  VENTAS DEL DÍA  ===================== */
let MD = null, LIN = [], dia = iso(new Date()), desc = '', motivo = 'Otro', pago = 'efectivo', guardando = false;
const MOTIVOS = ['Tarjeta VIP: ruleta','Tarjeta VIP: regalo','Cortesía','Otro'];
function catalogo(){
  const out = [], md = MD || {};
  const add = (grupo, arr)=> (arr||[]).forEach(p=>{ const sizes = (p.sizes && p.sizes.length) ? p.sizes.map(s=>({label:s.label, price:Number(s.price)||0})) : [{label:'Único', price:Number(p.price)||0}]; out.push({grupo, nombre:p.nombre||p.label, sizes, tipo:'plato'}); });
  add('Favoritas', md.favoritas); add('Fresas Dubai', md.premium); add('Más postres', md.otros); add('Bebidas', md.bebidas);
  (md.categoriasExtra||[]).forEach(c=> add(c.nombre, c.items));
  const EXC = ['sin_topping','chispas_color','cono'];
  (md.extras||[]).forEach(e=> out.push({grupo:'Extras · salsas (2 oz)', nombre:e.label, sizes:[{label:'Único', price:Number(e.extra)||0}], tipo:'extra'}));
  (md.toppings||[]).filter(t=>!EXC.includes(t.id)).forEach(t=> out.push({grupo:'Extras · toppings (2 oz)', nombre:'Extra '+t.label+' 2oz', sizes:[{label:'Único', price:t.id==='kataifi'?50:25}], tipo:'extra'}));
  return out;
}
const nomL = (c,s)=> (c.tipo==='plato' && c.sizes.length>1) ? c.nombre + ' ' + s.label : c.nombre;
const qtyL = (c,s)=>{ const l = LIN.find(x=>x.key === nomL(c,s) + '|' + s.price); return l ? l.cantidad : 0; };
function guardarBorr(){ try{ localStorage.setItem('fp_eq_borr_' + dia, JSON.stringify({LIN, desc, motivo, pago})); }catch(e){} }
function leerBorr(){ try{ const b = JSON.parse(localStorage.getItem('fp_eq_borr_' + dia)||'null'); if(b){ LIN = b.LIN||[]; desc = b.desc||''; motivo = b.motivo||'Otro'; pago = b.pago||'efectivo'; } else { LIN = []; desc = ''; motivo = 'Otro'; pago = 'efectivo'; } }catch(e){ LIN = []; } }
async function vVentas(){
  if(!MD){ $('#vista').innerHTML = '<div class="empty">Cargando…</div>'; try{ const m = await db.collection('menu_data').doc('main').get(); MD = m.exists ? m.data() : {}; }catch(e){ MD = {}; } }
  leerBorr(); pintarVentas();
}
function cambiarDia(v){ if(!v) return; dia = v; leerBorr(); pintarVentas(); }
async function pintarVentas(){
  const cat = catalogo(), grupos = [];
  cat.forEach((c,ci)=>{ let g = grupos.find(x=>x.n===c.grupo); if(!g){ g = {n:c.grupo, o:[]}; grupos.push(g); } g.o.push({c, ci}); });
  const filas = g=> g.o.map(({c,ci})=>c.sizes.map((s,si)=>`<div class="vs-row"><div class="vs-n">${esc(c.nombre)}${(c.sizes.length>1||s.label!=='Único')?' · '+esc(s.label.replace(' onzas',' oz')):''}<div class="vs-p">${money(s.price)}</div></div><div class="stp"><button onclick="paso(${ci},${si},-1)">−</button><span id="q_${ci}_${si}">${qtyL(c,s)}</span><button class="m" onclick="paso(${ci},${si},1)">+</button></div></div>`).join('')).join('');
  window.__cat = cat;
  $('#vista').innerHTML = `<div class="field"><label>Día de las ventas</label><input type="date" value="${dia}" max="${iso(new Date())}" onchange="cambiarDia(this.value)"></div>
    <p class="sub" style="margin:0 0 8px;">Escribe cuánto vendiste de cada producto. Al terminar, toca "Guardar ventas".</p>
    ${grupos.map((g,gi)=>`<details class="grp" ${gi<2?'open':''}><summary>${esc(g.n)}</summary>${filas(g)}</details>`).join('')}
    <div class="acts"><button class="btn sec" onclick="abrirPers()">+ Personalizada</button><button class="btn sec" onclick="abrirOtro()">+ Otro producto</button></div>
    <div id="lista" style="margin-top:12px;"></div>
    <div id="vFin" style="margin-top:12px;"><div class="grid2"><div class="field"><label>Pagó con</label><select onchange="pago=this.value; guardarBorr()"><option value="efectivo" ${pago==='efectivo'?'selected':''}>Efectivo</option><option value="transferencia" ${pago==='transferencia'?'selected':''}>Transferencia</option><option value="otros" ${pago==='otros'?'selected':''}>Otros</option></select></div>
      <div class="field"><label>Descuento (RD$)</label><input inputmode="decimal" value="${esc(desc)}" oninput="desc=this.value; guardarBorr(); totales()"></div></div>
      <div class="field"><label>Motivo del descuento</label><select onchange="motivo=this.value; guardarBorr()">${MOTIVOS.map(m=>`<option ${m===motivo?'selected':''}>${m}</option>`).join('')}</select></div>
      <div class="rowt"><span>Total</span><span class="tot" id="tTot">RD$0</span></div>
      <p class="sub">Si en el día pagaron unos con efectivo y otros con transferencia, guarda las ventas por separado, una vez por cada forma de pago.</p>
      <button class="btn" id="bGuardar" onclick="guardarVentas()">Guardar ventas</button></div>
    <div style="margin-top:22px;"><b>Lo que ya guardaste este día</b><div id="mias" class="sub" style="margin-top:6px;">Cargando…</div></div>`;
  pintarLista(); misVentas();
}
function paso(ci, si, d){
  const c = window.__cat[ci], s = c.sizes[si], nombre = nomL(c,s), key = nombre + '|' + s.price; let l = LIN.find(x=>x.key===key);
  if(!l){ if(d<0) return; l = {key, nombre, cantidad:0, precio:s.price}; LIN.push(l); }
  l.cantidad = Math.max(0, l.cantidad + d); if(!l.cantidad) LIN = LIN.filter(x=>x!==l);
  const el = document.getElementById('q_'+ci+'_'+si); if(el) el.textContent = l.cantidad; guardarBorr(); pintarLista();
}
function subtotal(){ return LIN.reduce((a,l)=>a + l.cantidad*l.precio, 0); }
function totales(){ const d = Math.min(num(desc), subtotal()); const t = $('#tTot'); if(t) t.textContent = money(subtotal() - d); const n = LIN.reduce((a,l)=>a+l.cantidad,0), bar = $('#bar'); if(bar){ bar.style.display = n ? 'flex' : 'none'; $('#barT').textContent = n + ' producto' + (n===1?'':'s') + ' · ' + money(subtotal()); } }
function pintarLista(){ const el = $('#lista'); if(!el) return; el.innerHTML = LIN.length ? '<b>Llevas:</b>' + LIN.map(l=>`<div class="rowt"><span>${l.cantidad} × ${esc(l.nombre)}</span><span>${money(l.cantidad*l.precio)}</span></div>`).join('') : ''; totales(); }
function abrirOtro(){ abrir(`<h3>Otro producto</h3><div class="field"><label>Nombre</label><input id="oN" placeholder="Ej. Brownie, jugo"></div><div class="grid2"><div class="field"><label>Precio c/u</label><input id="oP" inputmode="decimal"></div><div class="field"><label>Cantidad</label><input id="oC" inputmode="numeric" value="1"></div></div><div class="acts"><button class="btn sec" onclick="cerrar()">Cancelar</button><button class="btn" onclick="agregarOtro()">Agregar</button></div>`); }
function agregarOtro(){ const n = $('#oN').value.trim() || 'Otro', p = num($('#oP').value), c = Math.max(1, Math.round(num($('#oC').value))); if(!p){ toast('Escribe el precio'); return; } const key = n + '|' + p, y = LIN.find(x=>x.key===key); if(y) y.cantidad += c; else LIN.push({key, nombre:n, cantidad:c, precio:p}); cerrar(); guardarBorr(); pintarLista(); }
/* personalizada */
let P = null;
function abrirPers(){
  const md = MD || {}; if(!(md.tamanos||[]).length){ toast('No encuentro el menú. Avísale a la dueña.', 3500); return; }
  P = {tamano:md.tamanos[0].id, base:(md.bases||[{id:''}])[0].id, crema:(md.cremas||[{id:''}])[0].id, fruta:(md.frutas||[{id:''}])[0].id, topping:(md.toppings||[{id:''}])[0].id, extras:[], cant:1};
  const op = arr=> (arr||[]).map(x=>`<option value="${x.id}">${esc(x.label)}${x.extra?' (+'+x.extra+')':''}${x.price?' · '+money(x.price):''}</option>`).join('');
  const salsas = (md.extras||[]).map(e=>({id:e.id, label:e.label, extra:Number(e.extra)||0})), tops = (md.toppings||[]).filter(t=>!['sin_topping','chispas_color','cono'].includes(t.id)).map(t=>({id:'extop_'+t.id, label:'Extra '+t.label+' 2oz', extra:t.id==='kataifi'?50:25}));
  P.lista = salsas.concat(tops);
  abrir(`<h3>Fresas Pop personalizada</h3>
    <div class="grid2"><div class="field"><label>Tamaño</label><select onchange="P.tamano=this.value; pPrecio()">${op(md.tamanos)}</select></div><div class="field"><label>Cantidad</label><input inputmode="numeric" value="1" oninput="P.cant=Math.max(1,Math.round(num(this.value))||1); pPrecio()"></div></div>
    <div class="grid2"><div class="field"><label>Base</label><select onchange="P.base=this.value; pPrecio()">${op(md.bases)}</select></div><div class="field"><label>Crema</label><select onchange="P.crema=this.value; pPrecio()">${op(md.cremas)}</select></div></div>
    <div class="grid2"><div class="field"><label>Fruta</label><select onchange="P.fruta=this.value; pPrecio()">${op(md.frutas)}</select></div><div class="field"><label>Topping</label><select onchange="P.topping=this.value; pPrecio()">${op(md.toppings)}</select></div></div>
    <div class="sub" style="margin-bottom:4px;">Extras de 2 oz</div><div class="chips" style="flex-wrap:wrap; overflow:visible;">${P.lista.map(e=>`<div class="chip" onclick="pExtra('${e.id}', this)">${esc(e.label.replace(' 2oz',''))} +${e.extra}</div>`).join('')}</div>
    <div class="rowt"><span>Precio de cada una</span><b id="pU">—</b></div><div class="rowt"><span>Total</span><span class="tot" id="pT">—</span></div>
    <div class="acts"><button class="btn sec" onclick="cerrar()">Cancelar</button><button class="btn" onclick="agregarPers()">Agregar</button></div>`);
  pPrecio();
}
function pExtra(id, el){ const k = P.extras.indexOf(id); if(k>=0) P.extras.splice(k,1); else P.extras.push(id); el.classList.toggle('on', P.extras.includes(id)); pPrecio(); }
function pCalc(){
  const md = MD || {}, by = (arr,id)=> (arr||[]).find(x=>x.id===id) || {};
  const t = by(md.tamanos,P.tamano), b = by(md.bases,P.base), c = by(md.cremas,P.crema), fr = by(md.frutas,P.fruta), tp = by(md.toppings,P.topping);
  const regalo = P.base==='pistacho', cremaGratis = regalo || P.tamano==='canasta';
  let total = (Number(t.price)||0) + (Number(b.extra)||0) + (cremaGratis?0:(Number(c.extra)||0)) + (Number(fr.extra)||0);
  total += (regalo && tp.id!=='kataifi' && Number(tp.extra)>0) ? 0 : (Number(tp.extra)||0);
  P.extras.forEach(id=>{ const e = P.lista.find(x=>x.id===id); if(e) total += e.extra; });
  return {total, t, b, c, tp};
}
function pPrecio(){ const {total} = pCalc(); $('#pU').textContent = money(total); $('#pT').textContent = money(total*P.cant); }
function agregarPers(){
  const {total, t, b, c, tp} = pCalc(), ex = P.extras.map(id=>(P.lista.find(x=>x.id===id)||{}).label).filter(Boolean);
  const nombre = 'Personalizada ' + (t.label||'') + ' (' + [b.label, c.label, tp.label].filter(Boolean).join(', ') + (ex.length ? ' + ' + ex.map(x=>x.replace(' 2oz','')).join(', ') : '') + ')';
  const key = nombre + '|' + total, y = LIN.find(x=>x.key===key);
  if(y) y.cantidad += P.cant; else LIN.push({key, nombre, cantidad:P.cant, precio:total, pers:true, tam:t.label||'', crema:P.crema||'', base:P.base||''});
  cerrar(); guardarBorr(); pintarLista(); toast('Agregada ✅');
}
async function guardarVentas(){
  if(guardando) return; if(!LIN.length){ toast('Agrega al menos un producto'); return; }
  const sub = subtotal(), d = Math.min(Math.max(num(desc),0), sub);
  if(!confirm('¿Guardar estas ventas del ' + dia + ' por ' + money(sub - d) + '?')) return;
  guardando = true; $('#bGuardar').disabled = true;
  const items = LIN.map(l=>{ const o = {nombre:l.nombre, cantidad:l.cantidad, precio:l.precio}; if(l.pers){ o.pers = true; o.tam = l.tam; o.crema = l.crema; o.base = l.base; } return o; });
  try{
    await db.collection('ventas_equipo').add({dia, por:YO.correo, estado:'nuevo', items, descuento:d, motivoDescuento:d>0?motivo:'', pago, total:sub - d, ts:FV.serverTimestamp()});
    LIN = []; desc = ''; motivo = 'Otro'; pago = 'efectivo'; try{ localStorage.removeItem('fp_eq_borr_' + dia); }catch(e){}
    toast('Ventas guardadas ✅', 3000); pintarVentas();
  }catch(e){ toast('No se pudo guardar. Intenta otra vez.', 3500); guardando = false; const b = $('#bGuardar'); if(b) b.disabled = false; return; }
  guardando = false;
}
async function misVentas(){
  const el = $('#mias'); if(!el) return;
  try{
    const s = await db.collection('ventas_equipo').where('por','==',YO.correo).where('dia','==',dia).get();
    const L = s.docs.map(d=>({id:d.id, ...d.data()}));
    el.innerHTML = L.length ? L.map(v=>`<div class="mv" style="grid-template-columns:minmax(0,1fr) auto;"><div><b>${money(v.total)}</b> · ${(v.items||[]).reduce((a,i)=>a+i.cantidad,0)} productos<div class="sub">${v.estado==='nuevo'?'Pendiente de que la dueña la reciba':'Ya recibida ✓'}</div></div><div>${v.estado==='nuevo'?`<button class="btn red" style="padding:6px 12px; width:auto;" onclick="borrarMia('${v.id}')">Borrar</button>`:''}</div></div>`).join('') : 'Todavía no guardaste ventas este día.';
  }catch(e){ el.textContent = 'No se pudieron cargar.'; }
}
async function borrarMia(id){ if(!confirm('¿Borrar este registro?')) return; try{ await db.collection('ventas_equipo').doc(id).delete(); toast('Borrado'); misVentas(); }catch(e){ toast('No se pudo borrar', 3000); } }
</script>
</body>
</html>
